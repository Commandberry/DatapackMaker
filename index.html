<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC DataPack Studio | 1.13 ~ 26.3 통합 데이터팩 제작기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for Real .zip Data Pack Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        mc: {
                            bg: '#0d1117',
                            panel: '#161b22',
                            card: '#1f242c',
                            border: '#30363d',
                            emerald: '#10b981',
                            emeraldDark: '#059669',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
        .code-editor {
            tab-size: 2;
            line-height: 1.6;
        }
        /* 제작대 3x3 그리드 셀 효과 */
        .craft-slot {
            transition: all 0.15s ease;
            image-rendering: pixelated;
        }
        .craft-slot:hover {
            border-color: #10b981;
            transform: scale(1.03);
        }
        .pixel-icon {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-mc-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- 상단 내비게이션 & 버전 컨트롤 헤더 -->
    <header class="bg-mc-panel border-b border-mc-border sticky top-0 z-30 px-4 py-3 shadow-lg">
        <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-4">
            <!-- 로고 및 타이틀 -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-md shadow-emerald-950/50 border border-emerald-400/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-lg tracking-tight text-white">MC DataPack Studio</h1>
                        <span class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">1.13 ~ 26.3</span>
                    </div>
                    <p class="text-xs text-gray-400 hidden sm:block">버전별 팩 포맷·폴더 단수·JSON 스키마 자동 대응 데이터팩 빌더</p>
                </div>
            </div>

            <!-- 중앙: 마인크래프트 정식 릴리스 버전 선택기 -->
            <div class="flex flex-wrap items-center gap-3 bg-mc-bg p-1.5 rounded-xl border border-mc-border">
                <div class="flex items-center gap-2 pl-2">
                    <span class="text-xs font-semibold text-gray-400">타겟 버전:</span>
                    <select id="versionSelect" class="bg-mc-card text-white text-sm font-semibold rounded-lg px-3 py-1.5 border border-mc-border focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <!-- JS로 26.3 ~ 1.13 모든 정식 릴리스 동적 렌더링 -->
                    </select>
                </div>
                <div id="formatBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-950/60 border border-emerald-700/50 text-xs font-mono text-emerald-300">
                    <!-- pack_format / min_format 표시 -->
                </div>
                <div id="folderModeBadge" class="hidden md:flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-blue-950/50 border border-blue-700/40 text-xs text-blue-300" title="1.21(포맷 48)부터 일부 폴더명이 복수형에서 단수형으로 변경되었습니다.">
                    <!-- 단수/복수 폴더 구조 안내 -->
                </div>
            </div>

            <!-- 우측: 내보내기 및 프로젝트 초기화 액션 -->
            <div class="flex items-center gap-2">
                <button id="btnPackSettings" class="px-3 py-2 rounded-xl bg-mc-card hover:bg-gray-800 text-gray-200 text-xs font-semibold border border-mc-border transition flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>팩 설정</span>
                </button>
                <button id="btnExportZip" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md shadow-emerald-950/50 transition flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>.ZIP 다운로드</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 버전 변경 알림 / 호환성 배너 -->
    <div id="versionNoticeBar" class="bg-gradient-to-r from-emerald-950/40 via-mc-panel to-blue-950/40 border-b border-mc-border px-4 py-2 text-xs text-gray-300">
        <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="versionNoticeText">버전 정보가 로드되었습니다.</span>
            </div>
            <div class="flex items-center gap-3 text-[11px] text-gray-400">
                <span>네임스페이스: <strong id="headerNamespaceDisplay" class="text-emerald-400 font-mono">custom_pack</strong></span>
                <span>파일 수: <strong id="headerFileCount" class="text-white font-mono">0</strong>개</span>
            </div>
        </div>
    </div>

    <!-- 메인 3단 워크스페이스 -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 p-4">
        
        <!-- 좌측 패널 (3 cols): 파일 보기 & 기능 추가 탭 -->
        <aside class="lg:col-span-3 flex flex-col gap-4">
            <div class="bg-mc-panel border border-mc-border rounded-2xl p-4 shadow-sm flex flex-col gap-3 flex-1 min-h-[520px]">
                
                <!-- 좌측 메인 탭 전환 (파일 보기 vs 기능 추가) -->
                <div class="grid grid-cols-2 gap-1 bg-mc-bg p-1 rounded-xl border border-mc-border text-xs">
                    <button id="tabBtnFiles" onclick="switchSidebarTab('files')" class="py-2 rounded-lg font-bold bg-mc-card text-white shadow transition">파일 보기 (<span id="fileCountBadge">1</span>)</button>
                    <button id="tabBtnAdd" onclick="switchSidebarTab('add')" class="py-2 rounded-lg font-bold text-gray-400 hover:text-white transition">기능 추가</button>
                </div>

                <!-- 탭 1: 파일 보기 (생성된 파일 관리 및 삭제) -->
                <div id="sidebarFilesTab" class="flex-1 flex flex-col gap-2 overflow-y-auto pr-1">
                    <div class="flex items-center justify-between pt-1 pb-1">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-400">내 데이터팩 파일 목록</span>
                        <button onclick="switchSidebarTab('add')" class="text-[11px] text-emerald-400 hover:underline">+ 새 파일 추가</button>
                    </div>
                    <div id="userFileListContainer" class="space-y-1.5 font-mono text-xs">
                        <!-- 동적 렌더링 -->
                    </div>
                </div>

                <!-- 탭 2: 기능 추가 (카테고리별 데이터팩 컴포넌트) -->
                <div id="sidebarAddTab" class="hidden flex-1 flex flex-col gap-3 overflow-y-auto pr-1">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-400">카테고리별 기능 선택</span>
                        <span id="availableCatCount" class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md"></span>
                    </div>
                    
                    <div class="flex gap-1 bg-mc-bg p-1 rounded-xl border border-mc-border text-xs">
                        <button data-group="all" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold bg-mc-card text-white shadow">전체</button>
                        <button data-group="core" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white">기본</button>
                        <button data-group="gameplay" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white">전투/아이템</button>
                        <button data-group="world" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white">월드</button>
                    </div>

                    <div id="categoryList" class="grid grid-cols-1 gap-1.5">
                        <!-- 동적 렌더링 -->
                    </div>
                </div>

            </div>
        </aside>

        <!-- 중앙 패널 (5 cols): 비주얼 빌더 (GUI) -->
        <section class="lg:col-span-5 bg-mc-panel border border-mc-border rounded-2xl p-5 shadow-sm flex flex-col gap-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-mc-border">
                <div>
                    <div class="flex items-center gap-2">
                        <span id="editorCategoryBadge" class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">PACK.MCMETA</span>
                        <h2 id="editorTitle" class="text-base font-bold text-white">팩 메타데이터 설정</h2>
                    </div>
                    <p id="editorFilePath" class="text-xs font-mono text-gray-400 mt-1">pack.mcmeta</p>
                </div>
                <button id="btnDeleteCurrentFile" class="hidden px-2.5 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 text-xs font-semibold transition">
                    파일 삭제
                </button>
            </div>

            <!-- 비주얼 폼 컨테이너 -->
            <div id="visualBuilderContainer" class="flex-1 overflow-y-auto space-y-4 pr-1">
                <!-- 선택된 파일 종류에 맞는 GUI 폼이 여기에 렌더링됨 -->
            </div>
        </section>

        <!-- 우측 패널 (4 cols): 실시간 코드 미리보기 & 직접 편집 -->
        <section class="lg:col-span-4 bg-mc-panel border border-mc-border rounded-2xl p-5 shadow-sm flex flex-col gap-3">
            <div class="flex items-center justify-between pb-3 border-b border-mc-border">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                    <h2 class="text-sm font-bold text-white">실시간 코드 출력</h2>
                    <span id="codeSyntaxBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-mc-bg text-gray-400 border border-mc-border">JSON</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="btnFormatJson" class="px-2.5 py-1 rounded-lg bg-mc-card hover:bg-gray-800 text-gray-300 text-xs border border-mc-border transition" title="JSON 정렬">
                        정렬
                    </button>
                    <button id="btnCopyCode" class="px-2.5 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 text-xs font-semibold border border-emerald-500/30 transition flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        <span>복사</span>
                    </button>
                </div>
            </div>

            <!-- 코드 에디터 텍스트 영역 -->
            <div class="relative flex-1 flex flex-col min-h-[420px]">
                <textarea id="rawCodeEditor" spellcheck="false" class="code-editor flex-1 w-full bg-mc-bg text-emerald-300 font-mono text-xs p-4 rounded-xl border border-mc-border focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                <div id="codeStatusFooter" class="mt-2 flex items-center justify-between text-[11px] text-gray-400">
                    <span id="jsonValidStatus" class="text-emerald-400 font-medium">✓ 유효한 구문입니다</span>
                    <span>직접 수정 시 즉시 파일에 반영됩니다</span>
                </div>
            </div>
        </section>

    </main>

    <!-- 토스트 메시지 컨테이너 -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 새 파일 생성 모달 -->
    <div id="newFileModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
        <div class="bg-mc-panel border border-mc-border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 id="modalCategoryTitle" class="text-lg font-bold text-white">새 기능 파일 생성</h3>
                <button id="btnCloseModal" class="text-gray-400 hover:text-white p-1">✕</button>
            </div>
            <p id="modalCategoryDesc" class="text-xs text-gray-400 leading-relaxed"></p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">네임스페이스 (Namespace)</label>
                    <input id="modalNamespaceInput" type="text" class="w-full bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="custom_pack">
                </div>
                <div id="modalSubfolderWrapper" class="hidden">
                    <label class="block text-xs font-semibold text-gray-300 mb-1">태그 대상 폴더 (Tag Type)</label>
                    <select id="modalTagTypeSelect" class="w-full bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500">
                        <!-- 동적 렌더링 -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">파일 이름 (확장자 제외, 소문자/숫자/_/-)</label>
                    <input id="modalFileNameInput" type="text" class="w-full bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="example_item">
                    <p id="modalPreviewPath" class="text-[11px] font-mono text-emerald-400 mt-1.5 break-all"></p>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="btnCancelModal" class="px-4 py-2 rounded-xl bg-mc-card hover:bg-gray-800 text-gray-300 text-xs font-semibold">취소</button>
                <button id="btnConfirmCreateFile" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">생성하기</button>
            </div>
        </div>
    </div>

    <!-- 버전별 비주얼 아이템 선택 모달 (Item Picker) -->
    <div id="itemPickerModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-mc-panel border border-mc-border rounded-2xl max-w-2xl w-full p-5 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-3 border-b border-mc-border">
                <div>
                    <h3 id="itemPickerTitle" class="text-base font-bold text-white flex items-center gap-2">
                        <span>🎒 아이템 선택기</span>
                        <span id="itemPickerVersionBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"></span>
                    </h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">선택한 마인크래프트 버전에서 존재하는 아이템만 필터링되어 표시됩니다.</p>
                </div>
                <button onclick="closeItemPicker()" class="text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-mc-card">✕</button>
            </div>

            <!-- 검색 및 카테고리 필터 -->
            <div class="flex flex-wrap gap-2 my-3">
                <input id="itemSearchInput" type="text" oninput="renderItemPickerGrid()" placeholder="아이템 이름 또는 ID 검색 (예: 다이아몬드, diamond, 철괴, 네더라이트...)"
                    class="flex-1 min-w-[200px] bg-mc-bg border border-mc-border rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                <select id="itemPickerCatFilter" onchange="renderItemPickerGrid()" class="bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500">
                    <option value="all">전체 분류</option>
                    <option value="ore">광물 / 주괴</option>
                    <option value="tool">도구 / 무기 / 방어구</option>
                    <option value="block">블록 / 건축</option>
                    <option value="food">음식 / 포션 / 특수</option>
                    <option value="misc">자연 / 몬스터 전리품</option>
                </select>
            </div>

            <!-- 아이템 아이콘 그리드 -->
            <div id="itemPickerGrid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 pr-1 min-h-[260px]">
                <!-- 동적 렌더링 -->
            </div>

            <!-- 하단 직접 ID 입력 & 비우기 -->
            <div class="pt-3 mt-3 border-t border-mc-border flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-1 min-w-[220px]">
                    <input id="itemCustomDirectInput" type="text" placeholder="직접 ID 입력 (예: minecraft:beacon)"
                        class="flex-1 bg-mc-bg border border-mc-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-emerald-300 focus:outline-none focus:border-emerald-500">
                    <button onclick="selectPickedItem(document.getElementById('itemCustomDirectInput').value)" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shrink-0">직접 적용</button>
                </div>
                <button onclick="selectPickedItem('')" class="px-3 py-1.5 rounded-lg bg-rose-950/70 hover:bg-rose-900 text-rose-300 border border-rose-800/50 text-xs font-semibold">슬롯 비우기</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. 마인크래프트 1.13 ~ 26.3 모든 정식 릴리스 데이터팩 포맷 데이터베이스
         * ============================================================================

            if (!itemId) return null;

            const shortName = cleanId.replace(/^minecraft:/, '');

            return {

        /**
         * 헬퍼: 버전별 실제 파일 경로 계산
         */
        function resolveFilePath(file, versionObj) {
            if (file.id === 'pack.mcmeta') return 'pack.mcmeta';
            
            // load / tick 시스템 태그 처리
            if (file.categoryId === 'load_tick') {
                const tagFolder = versionObj.major >= 48 ? 'tags/function' : 'tags/functions';
                return `data/minecraft/${tagFolder}/${file.name}.json`;
            }

            const cat = FEATURE_CATEGORIES.find(c => c.id === file.categoryId);
            if (!cat) return `data/${file.namespace}/${file.name}.json`;

            let folder = cat.getFolder(versionObj);
            if (file.categoryId === 'tags' && file.subTagType) {
                // 태그의 경우 1.21+에서 functions -> function, items -> item 등 단수화 반영
                let tagSub = file.subTagType;
                if (versionObj.major >= 48) {
                    const singularMap = {
                        'functions': 'function',
                        'blocks': 'block',
                        'items': 'item',
                        'entity_types': 'entity_type',
                        'fluids': 'fluid',
                        'game_events': 'game_event'
                    };
                    tagSub = singularMap[tagSub] || tagSub;
                } else {
                    const pluralMap = {
                        'function': 'functions',
                        'block': 'blocks',
                        'item': 'items',
                        'entity_type': 'entity_types',
                        'fluid': 'fluids',
                        'game_event': 'game_events'
                    };
                    tagSub = pluralMap[tagSub] || tagSub;
                }
                folder = `tags/${tagSub}`;
            }

            return `data/${file.namespace}/${folder}/${file.name}${cat.ext}`;
        }

        /**
         * 헬퍼: 버전별 pack.mcmeta JSON 생성
         */
        function generatePackMcmetaObj(versionObj) {
            const packObj = {
                description: state.packDescription
            };

            // 1.21.9 (88.0) 이상: min_format / max_format 지원 + 호환용 pack_format
            if (versionObj.major >= 88) {
                packObj.pack_format = versionObj.major;
                packObj.min_format = [versionObj.major, versionObj.minor];
                packObj.max_format = [versionObj.major, versionObj.minor];
            } else {
                packObj.pack_format = versionObj.major;
            }

            // 1.20.2 (18) 이상에서 다중 버전 호환 범위 옵션 활성화 시
            if (state.includeSupportedFormats && versionObj.major >= 18) {
                packObj.supported_formats = {
                    min_inclusive: Number(state.minSupportedFormat) || versionObj.major,
                    max_inclusive: Number(state.maxSupportedFormat) || versionObj.major
                };
            }

            return { pack: packObj };
        }
