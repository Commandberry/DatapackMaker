<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC DataPack Studio | 1.13 ~ 26.3 통합 데이터팩 제작기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for Real .zip Data Pack Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        mc: {
                            bg: '#0d1117',
                            panel: '#161b22',
                            card: '#1f242c',
                            border: '#30363d',
                            emerald: '#10b981',
                            emeraldDark: '#059669',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
        .craft-slot { transition: all 0.15s ease; image-rendering: pixelated; }
        .craft-slot:hover { border-color: #10b981; transform: scale(1.03); }
        .pixel-icon { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-mc-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- 상단 내비게이션 -->
    <header class="bg-mc-panel border-b border-mc-border sticky top-0 z-30 px-4 py-3 shadow-lg">
        <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-md border border-emerald-400/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-lg tracking-tight text-white">MC DataPack Studio</h1>
                        <span class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">1.13 ~ 26.3</span>
                    </div>
                    <p class="text-xs text-gray-400 hidden sm:block">버전별 팩 포맷·폴더 단수·지원 기능 자동 대응 데이터팩 빌더</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3 bg-mc-bg p-1.5 rounded-xl border border-mc-border">
                <div class="flex items-center gap-2 pl-2">
                    <span class="text-xs font-semibold text-gray-400">타겟 버전:</span>
                    <select id="versionSelect" class="bg-mc-card text-white text-sm font-semibold rounded-lg px-3 py-1.5 border border-mc-border focus:outline-none focus:border-emerald-500 cursor-pointer">
                    </select>
                </div>
                <div id="formatBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-950/60 border border-emerald-700/50 text-xs font-mono text-emerald-300"></div>
                <div id="folderModeBadge" class="hidden md:flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-blue-950/50 border border-blue-700/40 text-xs text-blue-300"></div>
            </div>

            <div class="flex items-center gap-2">
                <button id="btnPackSettings" onclick="selectFile('pack.mcmeta')" class="px-3 py-2 rounded-xl bg-mc-card hover:bg-gray-800 text-gray-200 text-xs font-semibold border border-mc-border transition flex items-center gap-1.5 cursor-pointer">
                    <span>팩 설정</span>
                </button>
                <button id="btnExportZip" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md transition flex items-center gap-1.5 cursor-pointer">
                    <span>.ZIP 다운로드</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 워크스페이스 -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 p-4">
        
        <!-- 좌측 패널 (4 cols): 파일 보기 & 기능 추가 탭 -->
        <aside class="lg:col-span-4 flex flex-col gap-4">
            <div class="bg-mc-panel border border-mc-border rounded-2xl p-4 shadow-sm flex flex-col gap-3 flex-1 min-h-[560px]">
                <div class="grid grid-cols-2 gap-1 bg-mc-bg p-1 rounded-xl border border-mc-border text-xs">
                    <button id="tabBtnFiles" onclick="switchSidebarTab('files')" class="py-2 rounded-lg font-bold bg-mc-card text-white shadow transition">파일 보기 (<span id="fileCountBadge">1</span>)</button>
                    <button id="tabBtnAdd" onclick="switchSidebarTab('add')" class="py-2 rounded-lg font-bold text-gray-400 hover:text-white transition">기능 추가</button>
                </div>

                <!-- 탭 1: 파일 보기 -->
                <div id="sidebarFilesTab" class="flex-1 flex flex-col gap-2 overflow-y-auto pr-1">
                    <div class="flex items-center justify-between pt-1 pb-1">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-400">내 데이터팩 파일 목록</span>
                        <button onclick="switchSidebarTab('add')" class="text-[11px] text-emerald-400 hover:underline cursor-pointer">+ 새 파일 추가</button>
                    </div>
                    <div id="userFileListContainer" class="space-y-1.5 font-mono text-xs"></div>
                </div>

                <!-- 탭 2: 기능 추가 -->
                <div id="sidebarAddTab" class="hidden flex-1 flex flex-col gap-3 overflow-y-auto pr-1">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-400">버전별 지원 카테고리</span>
                        <span id="availableCatCount" class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md"></span>
                    </div>
                    <div class="flex gap-1 bg-mc-bg p-1 rounded-xl border border-mc-border text-xs">
                        <button data-group="all" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold bg-mc-card text-white shadow">전체</button>
                        <button data-group="core" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white">기본</button>
                        <button data-group="gameplay" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white">전투/아이템</button>
                        <button data-group="world" class="cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white">월드</button>
                    </div>
                    <div id="categoryList" class="grid grid-cols-1 gap-1.5"></div>
                </div>
            </div>
        </aside>

        <!-- 우측 패널 (8 cols): 비주얼 빌더 (GUI) -->
        <section class="lg:col-span-8 bg-mc-panel border border-mc-border rounded-2xl p-5 shadow-sm flex flex-col gap-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-mc-border">
                <div>
                    <div class="flex items-center gap-2">
                        <span id="editorCategoryBadge" class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">PACK.MCMETA</span>
                        <h2 id="editorTitle" class="text-base font-bold text-white">팩 메타데이터 설정</h2>
                    </div>
                    <p id="editorFilePath" class="text-xs font-mono text-gray-400 mt-1">pack.mcmeta</p>
                </div>
                <button id="btnDeleteCurrentFile" onclick="deleteFile(state.activeFileId)" class="hidden px-2.5 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 text-xs font-semibold transition cursor-pointer">
                    파일 삭제
                </button>
            </div>

            <!-- 비주얼 폼 컨테이너 -->
            <div id="visualBuilderContainer" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>
        </section>

    </main>

    <!-- 토스트 메시지 컨테이너 -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 새 파일 생성 모달 -->
    <div id="newFileModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
        <div class="bg-mc-panel border border-mc-border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 id="modalCategoryTitle" class="text-lg font-bold text-white">새 기능 파일 생성</h3>
                <button id="btnCloseModal" class="text-gray-400 hover:text-white p-1 cursor-pointer">✕</button>
            </div>
            <p id="modalCategoryDesc" class="text-xs text-gray-400 leading-relaxed"></p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">네임스페이스 (Namespace)</label>
                    <input id="modalNamespaceInput" type="text" class="w-full bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="custom_pack">
                </div>
                <div id="modalSubfolderWrapper" class="hidden">
                    <label class="block text-xs font-semibold text-gray-300 mb-1">태그 대상 폴더 (Tag Type)</label>
                    <select id="modalTagTypeSelect" class="w-full bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">파일 이름</label>
                    <input id="modalFileNameInput" type="text" class="w-full bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="example_item">
                    <p id="modalPreviewPath" class="text-[11px] font-mono text-emerald-400 mt-1.5 break-all"></p>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="btnCancelModal" class="px-4 py-2 rounded-xl bg-mc-card hover:bg-gray-800 text-gray-300 text-xs font-semibold cursor-pointer">취소</button>
                <button id="btnConfirmCreateFile" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold cursor-pointer">생성하기</button>
            </div>
        </div>
    </div>

    <!-- 아이템 선택기 모달 -->
    <div id="itemPickerModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-mc-panel border border-mc-border rounded-2xl max-w-2xl w-full p-5 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-3 border-b border-mc-border">
                <h3 id="itemPickerTitle" class="text-base font-bold text-white flex items-center gap-2">
                    <span>🎒 아이템 선택기</span>
                    <span id="itemPickerVersionBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"></span>
                </h3>
                <button onclick="closeItemPicker()" class="text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-mc-card cursor-pointer">✕</button>
            </div>

            <div class="flex flex-wrap gap-2 my-3">
                <input id="itemSearchInput" type="text" oninput="renderItemPickerGrid()" placeholder="아이템 이름 또는 ID 검색..."
                    class="flex-1 min-w-[200px] bg-mc-bg border border-mc-border rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                <select id="itemPickerCatFilter" onchange="renderItemPickerGrid()" class="bg-mc-bg border border-mc-border rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500">
                    <option value="all">전체 분류</option>
                    <option value="ore">광물 / 주괴</option>
                    <option value="tool">도구 / 무기 / 방어구</option>
                    <option value="block">블록 / 건축</option>
                    <option value="food">음식 / 포션</option>
                    <option value="misc">자연 / 기타</option>
                </select>
            </div>

            <div id="itemPickerGrid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 pr-1 min-h-[260px]"></div>

            <div class="pt-3 mt-3 border-t border-mc-border flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-1 min-w-[220px]">
                    <input id="itemCustomDirectInput" type="text" placeholder="직접 ID 입력 (예: minecraft:beacon)"
                        class="flex-1 bg-mc-bg border border-mc-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-emerald-300 focus:outline-none focus:border-emerald-500">
                    <button onclick="selectPickedItem(document.getElementById('itemCustomDirectInput').value)" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shrink-0 cursor-pointer">직접 적용</button>
                </div>
                <button onclick="selectPickedItem('')" class="px-3 py-1.5 rounded-lg bg-rose-950/70 hover:bg-rose-900 text-rose-300 border border-rose-800/50 text-xs font-semibold cursor-pointer">슬롯 비우기</button>
            </div>
        </div>
    </div>

    <script>
        // 마인크래프트 버전 데이터베이스
        const MC_VERSIONS = [
            { id: '26.3', label: '26.3 (최신 정식 릴리스)', format: 121.0, major: 121, minor: 0, note: '데이터팩 포맷 121.0.' },

        function getItemMeta(itemId) {
            if (!itemId) return null;
            const cleanId = itemId.trim().toLowerCase();
            const found = MC_ITEMS_DB.find(i => i.id === cleanId);
            const shortName = cleanId.replace(/^minecraft:/, '');
            let wikiFileName = found && found.wikiImg ? found.wikiImg : (shortName.charAt(0).toUpperCase() + shortName.slice(1) + '.png');
            const textureUrl = `https://minecraft.wiki/images/thumb/${wikiFileName}/120px-${wikiFileName}`;

            return {
                id: cleanId,
                name: found ? found.name : shortName,
                shortName: shortName,
                textureUrl: textureUrl
            };
        }

        function renderItemIconHtml(itemId, sizeClass = 'w-7 h-7') {
            const meta = getItemMeta(itemId);
            if (!meta) return `<span class="text-gray-600 text-xs">-</span>`;
            return `
                <div class="${sizeClass} flex items-center justify-center bg-mc-card rounded-lg border border-mc-border overflow-hidden shadow-sm pixel-icon relative group">
                    <img src="${meta.textureUrl}" alt="${meta.name}" class="w-6 h-6 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="absolute inset-0 hidden items-center justify-center bg-mc-panel text-[9px] font-mono font-bold text-emerald-400 px-0.5 text-center leading-tight">
                        ${meta.shortName.slice(0, 4)}
                    </div>
                </div>
            `;
        }

        function resolveFilePath(file, versionObj) {
            if (file.id === 'pack.mcmeta') return 'pack.mcmeta';
            if (file.categoryId === 'load_tag' || file.categoryId === 'tick_tag') {
                const tagFolder = versionObj.major >= 48 ? 'tags/function' : 'tags/functions';
                return `data/minecraft/${tagFolder}/${file.name}.json`;
            }
            const cat = FEATURE_CATEGORIES.find(c => c.id === file.categoryId);
            if (!cat) return `data/${file.namespace}/${file.name}.json`;
            let folder = cat.getFolder(versionObj);
            if (file.categoryId === 'tags' && file.subTagType) {
                const sub = versionObj.major >= 48 ? file.subTagType : (file.subTagType === 'entity_type' ? 'entity_types' : `${file.subTagType}s`);
                folder = `tags/${sub}`;
            }
            return `data/${file.namespace}/${folder}/${file.name}${cat.ext}`;
        }

            if (type === 'open_url') return { type: 'minecraft:open_url', url: val || 'https://minecraft.net' };
            if (type === 'copy_to_clipboard') return { type: 'minecraft:copy_to_clipboard', value: val || '' };
            if (type === 'show_dialog') return { type: 'minecraft:show_dialog', dialog: val || 'minecraft:server_links' };
            if (type === 'dynamic/run_command') return { type: 'minecraft:dynamic/run_command', template: val || '' };
            return undefined;
        }

        function serializeFileToText(file, versionObj) {
            if (file.id === 'pack.mcmeta') return JSON.stringify(generatePackMcmetaObj(versionObj), null, 2);
            if (file.categoryId === 'function') return file.data.commands || '';
            
            const d = file.data;
            let obj = {};

            if (file.categoryId === 'load_tag' || file.categoryId === 'tick_tag' || file.categoryId === 'tags') {
                obj = {
                    replace: Boolean(d.replace),
                    values: Array.isArray(d.values) ? d.values : []
                };
            } else if (file.categoryId === 'loot_table') {
                const entry = {
                    type: 'minecraft:item',
                    name: d.item || 'minecraft:diamond',
                    functions: [
                        {
                            function: 'minecraft:set_count',
                            count: { min: Number(d.minCount) || 1, max: Number(d.maxCount) || 3 }
                        }
                    ]
                };
                if (d.nbtString && d.nbtString.trim()) {
                    if (versionObj.major >= 41) {
                        try { entry.functions.push({ function: 'minecraft:set_components', components: JSON.parse(d.nbtString) }); } catch(e){}
                    } else {
                        entry.functions.push({ function: 'minecraft:set_nbt', tag: d.nbtString });
                    }
                }
                if (d.lootingEnchant && versionObj.major >= 5) {
                    entry.functions.push({
                        function: 'minecraft:apply_bonus',
                        enchantment: 'minecraft:looting',
                        formula: 'minecraft:binomial_with_bonus_count',
                        parameters: { extra: 1, probability: 0.1 }
                    });
                }
                obj = {
                    type: d.lootType || 'minecraft:chest',
                    pools: [{
                        rolls: Number(d.rolls) || 1,
                        bonus_rolls: Number(d.bonusRolls) || 0,
                        entries: [entry]
                    }]
                };
            } else if (file.categoryId === 'recipe') {
                const resultKey = versionObj.major >= 41 ? 'id' : 'item';
                obj = {
                    type: d.recipeType || 'minecraft:crafting_shaped',
                    pattern: ["   ", " X ", "   "],
                    key: { "X": { item: d.gridItems?.[4] || 'minecraft:diamond' } },
                    result: { [resultKey]: d.resultItem || 'minecraft:golden_apple', count: Number(d.resultCount) || 1 }
                };
            } else if (file.categoryId === 'advancement') {
                const iconKey = versionObj.major >= 41 ? 'id' : 'item';
                let parsedConditions = {};
                if (d.conditionsObj) {
                    try {
                        parsedConditions = JSON.parse(d.conditionsObj);
                    } catch (e) {
                        parsedConditions = {};
                    }
                }
                obj = {
                    display: {
                        icon: { [iconKey]: d.iconItem || 'minecraft:nether_star' },
                        title: { text: d.title || '발전 과제' },
                        description: { text: d.description || '설명' },
                        frame: d.frame || 'task',
                        show_toast: d.showToast !== false,
                        announce_to_chat: d.announceToChat !== false,
                        hidden: Boolean(d.hidden)
                    },
                    criteria: {
                        requirement: {
                            trigger: d.trigger || 'minecraft:tick',
                            conditions: parsedConditions
                        }
                    }
                };
            } else if (file.categoryId === 'predicate') {
                const cond = d.condition || 'minecraft:weather_check';
                const buildSubPredicateObj = (sub) => {
                    if (!sub || typeof sub !== 'object') return { condition: 'minecraft:weather_check', raining: true, thundering: false };
                    const sc = sub.condition || 'minecraft:weather_check';
                    if (sc === 'minecraft:weather_check') {
                        return {
                            condition: 'minecraft:weather_check',
                            raining: Boolean(sub.raining),
                            thundering: Boolean(sub.thundering)
                        };
                    }
                    if (sc === 'minecraft:random_chance') {
                        return {
                            condition: 'minecraft:random_chance',
                            chance: Number(sub.chance ?? 0.5)
                        };
                    }
                    if (sc === 'minecraft:entity_properties') {
                        const out = {
                            condition: 'minecraft:entity_properties',
                            entity: sub.entity || 'this',
                            predicate: {}
                        };
                        const flags = {};
                        if (sub.flagSneaking) flags.is_sneaking = true;
                        if (sub.flagSprinting) flags.is_sprinting = true;
                        if (sub.flagSwimming) flags.is_swimming = true;
                        if (sub.flagBaby) flags.is_baby = true;
                        if (sub.flagOnGround) flags.on_ground = true;
                        if (Object.keys(flags).length > 0) out.predicate.flags = flags;
                        if (sub.entityTypeFilter && sub.entityTypeFilter.trim()) out.predicate.type = sub.entityTypeFilter.trim();
                        return out;
                    }
                    if (sc === 'minecraft:reference') {
                        return {
                            condition: 'minecraft:reference',
                            name: sub.name || 'minecraft:example'
                        };
                    }
                    return sub;
                };

                obj = { condition: cond };
                if (cond === 'minecraft:weather_check') {
                    obj.raining = Boolean(d.raining);
                    obj.thundering = Boolean(d.thundering);
                } else if (cond === 'minecraft:random_chance') {
                    obj.chance = Number(d.chance ?? 0.5);
                } else if (cond === 'minecraft:entity_properties') {
                    obj.entity = d.entity || 'this';
                    obj.predicate = {};
                    const flags = {};
                    if (d.flagSneaking) flags.is_sneaking = true;
                    if (d.flagSprinting) flags.is_sprinting = true;
                    if (d.flagSwimming) flags.is_swimming = true;
                    if (d.flagBaby) flags.is_baby = true;
                    if (d.flagOnGround) flags.on_ground = true;
                    if (d.flagInWater) flags.is_in_water = true;
                    if (d.flagOnFire) flags.is_on_fire = true;
                    if (d.flagInPowderSnow) flags.is_in_powder_snow = true;
                    if (Object.keys(flags).length > 0) obj.predicate.flags = flags;
                    const inputMap = {};
                    if (d.inputForward) inputMap.forward = true;
                    if (d.inputBackward) inputMap.backward = true;
                    if (d.inputLeft) inputMap.left = true;
                    if (d.inputRight) inputMap.right = true;
                    if (d.inputSneak) inputMap.sneak = true;
                    if (d.inputSprint) inputMap.sprint = true;
                    if (d.inputJump) inputMap.jump = true;
                    if (Object.keys(inputMap).length > 0) {
                        obj.predicate.type_specific = {
                            type: 'minecraft:player',
                            input: inputMap
                        };
                    }
                    const equipMap = {};
                    const formatEquipItems = (raw) => {
                        const arr = raw.split(',').map(s => s.trim()).filter(Boolean);
                        if (versionObj.major >= 41) return { items: arr.length === 1 ? arr[0] : arr };
                        return { item: arr[0] };
                    };
                    if (d.equipHead && d.equipHead.trim()) equipMap.head = formatEquipItems(d.equipHead);
                    if (d.equipChest && d.equipChest.trim()) equipMap.chest = formatEquipItems(d.equipChest);
                    if (d.equipLegs && d.equipLegs.trim()) equipMap.legs = formatEquipItems(d.equipLegs);
                    if (d.equipFeet && d.equipFeet.trim()) equipMap.feet = formatEquipItems(d.equipFeet);
                    if (d.equipMainhand && d.equipMainhand.trim()) equipMap.mainhand = formatEquipItems(d.equipMainhand);
                    if (d.equipOffhand && d.equipOffhand.trim()) equipMap.offhand = formatEquipItems(d.equipOffhand);
                    if (Object.keys(equipMap).length > 0) {
                        obj.predicate.equipment = equipMap;
                    }
                    const nbtParts = [];
                    if (d.nbtTags && d.nbtTags.trim()) {
                        const tagTokens = d.nbtTags.split(',').map(s => s.trim()).filter(Boolean).map(s => `"${s.replace(/^"|"$/g, '')}"`);
                        if (tagTokens.length > 0) nbtParts.push(`Tags:[${tagTokens.join(',')}]`);
                    }
                    if (d.nbtNoGravity === 'true' || d.nbtNoGravity === 'false') nbtParts.push(`NoGravity:${d.nbtNoGravity === 'true' ? '1b' : '0b'}`);
                    if (d.nbtInvulnerable === 'true' || d.nbtInvulnerable === 'false') nbtParts.push(`Invulnerable:${d.nbtInvulnerable === 'true' ? '1b' : '0b'}`);
                    if (d.nbtSilent === 'true' || d.nbtSilent === 'false') nbtParts.push(`Silent:${d.nbtSilent === 'true' ? '1b' : '0b'}`);
                    if (d.nbtGlowing === 'true' || d.nbtGlowing === 'false') nbtParts.push(`Glowing:${d.nbtGlowing === 'true' ? '1b' : '0b'}`);
                    if (d.nbtNoAI === 'true' || d.nbtNoAI === 'false') nbtParts.push(`NoAI:${d.nbtNoAI === 'true' ? '1b' : '0b'}`);
                    if (d.nbtPersistenceRequired === 'true' || d.nbtPersistenceRequired === 'false') nbtParts.push(`PersistenceRequired:${d.nbtPersistenceRequired === 'true' ? '1b' : '0b'}`);
                    if (d.nbtCustomNameVisible === 'true' || d.nbtCustomNameVisible === 'false') nbtParts.push(`CustomNameVisible:${d.nbtCustomNameVisible === 'true' ? '1b' : '0b'}`);
                    if (d.nbtSelectedItemSlot !== '' && d.nbtSelectedItemSlot !== undefined && d.nbtSelectedItemSlot !== null) {
                        nbtParts.push(`SelectedItemSlot:${Number(d.nbtSelectedItemSlot)}`);
                    }
                    if (d.nbtHealth !== '' && d.nbtHealth !== undefined && d.nbtHealth !== null) {
                        nbtParts.push(`Health:${Number(d.nbtHealth)}f`);
                    }
                    if (d.entityNbt && d.entityNbt.trim()) {
                        const rawCustom = d.entityNbt.trim().replace(/^\{|\}$/g, '').trim();
                        if (rawCustom) nbtParts.push(rawCustom);
                    }
                    if (nbtParts.length > 0) {
                        obj.predicate.nbt = `{${nbtParts.join(',')}}`;
                    }
                    if (d.entityTypeFilter && d.entityTypeFilter.trim()) obj.predicate.type = d.entityTypeFilter.trim();
                } else if (cond === 'minecraft:random_chance_with_looting' || cond === 'minecraft:random_chance_with_enchanted_bonus') {
                    obj.chance = Number(d.chance ?? 0.5);
                    if (versionObj.major >= 48) {
                        obj.enchantment = d.enchantment || 'minecraft:looting';
                        obj.unenchanted_chance = Number(d.chance ?? 0.5);
                        obj.enchanted_chance = {
                            type: 'minecraft:linear',
                            base: Number(d.chance ?? 0.5) + Number(d.looting_multiplier ?? 0.05),
                            per_level_above_first: Number(d.looting_multiplier ?? 0.05)
                        };
                    } else {
                        obj.looting_multiplier = Number(d.looting_multiplier ?? 0.05);
                    }
                } else if (cond === 'minecraft:time_check') {
                    if (d.timePeriod && Number(d.timePeriod) > 0) {
                        obj.period = Number(d.timePeriod);
                    }
                    if (d.timeMin !== undefined && d.timeMax !== undefined && d.timeMin !== '' && d.timeMax !== '') {
                        obj.value = { min: Number(d.timeMin), max: Number(d.timeMax) };
                    } else {
                        obj.value = Number(d.timeValue ?? 0);
                    }
                } else if (cond === 'minecraft:location_check') {
                    const loc = {};
                    if (d.dimensionId && d.dimensionId.trim()) loc.dimension = d.dimensionId.trim();
                    if (d.biomeId && d.biomeId.trim()) loc.biomes = d.biomeId.trim();
                    if (d.structureId && d.structureId.trim()) loc.structures = d.structureId.trim();
                    if (d.blockId && d.blockId.trim()) {
                        loc.block = { blocks: d.blockId.trim() };
                    } else if (d.blockTag && d.blockTag.trim()) {
                        loc.block = { tag: d.blockTag.trim().replace(/^#/, '') };
                    }
                    obj.predicate = loc;
                    if (d.entity) obj.offsetX = 0;
                } else if (cond === 'minecraft:block_state_property') {
                    obj.block = d.blockId || 'minecraft:stone';
                    if (d.blockTag && d.blockTag.trim()) {
                        try {
                            obj.properties = JSON.parse(d.blockTag);
                        } catch (e) {
                            obj.properties = {};
                        }
                    }
                } else if (cond === 'minecraft:match_tool') {
                    const pred = {};
                    if (d.itemId && d.itemId.trim()) pred.items = d.itemId.trim();
                    if (d.itemTag && d.itemTag.trim()) pred.tag = d.itemTag.trim().replace(/^#/, '');
                    obj.predicate = pred;
                } else if (cond === 'minecraft:damage_source_properties') {
                    const dmgPred = {};
                    if (d.damageSourceIsDirect) dmgPred.is_direct = true;
                    if (d.damageSourceIsProjectile) dmgPred.is_projectile = true;
                    if (d.damageSourceDirectEntityType && d.damageSourceDirectEntityType.trim()) {
                        dmgPred.direct_entity = { type: d.damageSourceDirectEntityType.trim() };
                    }
                    if (d.damageSourceSourceEntityType && d.damageSourceSourceEntityType.trim()) {
                        dmgPred.source_entity = { type: d.damageSourceSourceEntityType.trim() };
                    }
                    obj.predicate = dmgPred;
                } else if (cond === 'minecraft:entity_scores') {
                    obj.entity = d.entity || 'this';
                    const scoresObj = {};
                    const scoreRows = Array.isArray(d.entityScores) ? d.entityScores : [];
                    scoreRows.forEach(row => {
                        const name = (row.objective || '').trim();
                        if (!name) return;
                        const hasMin = row.min !== '' && row.min !== undefined && row.min !== null && !Number.isNaN(Number(row.min));
                        const hasMax = row.max !== '' && row.max !== undefined && row.max !== null && !Number.isNaN(Number(row.max));
                        if (hasMin && hasMax) {
                            scoresObj[name] = { min: Number(row.min), max: Number(row.max) };
                        } else if (hasMin) {
                            scoresObj[name] = { min: Number(row.min) };
                        } else if (hasMax) {
                            scoresObj[name] = { max: Number(row.max) };
                        } else {
                            scoresObj[name] = { min: 1 };
                        }
                    });
                    obj.scores = scoresObj;
                } else if (cond === 'minecraft:killed_by_player') {
                    // killed_by_player는 condition 필드만으로 구성됨
                } else if (cond === 'minecraft:table_bonus') {
                    obj.enchantment = d.tableBonusEnchantment || 'minecraft:fortune';
                    const parsedChances = String(d.tableBonusChances || '0.1, 0.2, 0.3')
                        .split(',')
                        .map(s => Number(s.trim()))
                        .filter(n => !Number.isNaN(n));
                    obj.chances = parsedChances.length > 0 ? parsedChances : [0.1, 0.2, 0.3];
                } else if (cond === 'minecraft:survives_explosion') {
                    // survives_explosion은 condition 필드만으로 구성됨
                } else if (cond === 'minecraft:reference') {
                    obj.name = d.refName || 'minecraft:example';
                } else if (cond === 'minecraft:all_of' || cond === 'minecraft:any_of' || cond === 'minecraft:alternative') {
                    const rawTerms = Array.isArray(d.terms) ? d.terms : [];
                    obj.terms = rawTerms.map(buildSubPredicateObj);
                } else if (cond === 'minecraft:inverted') {
                    obj.term = buildSubPredicateObj(d.term);
                } else {
                    if (d.chance !== undefined) obj.chance = Number(d.chance);
                    if (d.raining !== undefined) obj.raining = Boolean(d.raining);
                    if (d.thundering !== undefined) obj.thundering = Boolean(d.thundering);
                }
            } else if (file.categoryId === 'dimension') {
                const genType = d.generatorType || 'minecraft:noise';
                const generator = genType === 'minecraft:flat'
                    ? {
                        type: 'minecraft:flat',
                        settings: {
                            biome: d.biome || 'minecraft:plains',
                            layers: [{ block: d.block || 'minecraft:stone', height: 1 }],
                            structures: { structures: {} }
                        }
                    }
                    : {
                        type: 'minecraft:noise',
                        biome_source: {
                            type: 'minecraft:fixed',
                            biome: d.biome || 'minecraft:plains'
                        },
                        settings: 'minecraft:overworld'
                    };
                obj = {
                    type: d.type || 'minecraft:overworld',
                    generator
                };
            } else if (file.categoryId === 'worldgen_biome') {
                obj = {
                    has_precipitation: d.hasPrecipitation !== false,
                    temperature: Number(d.temperature ?? 0.8),
                    downfall: Number(d.downfall ?? 0.4),
                    effects: {
                        sky_color: Number(d.skyColor ?? 7907327),
                        fog_color: Number(d.fogColor ?? 12638463),
                        water_color: Number(d.waterColor ?? 4159204),
                        water_fog_color: Number(d.waterFogColor ?? 329011)
                    },
                    carvers: {},
                    features: [],
                    spawners: {
                        creature: d.creatureSpawn !== false ? [{ type: 'minecraft:sheep', weight: 12, minCount: 4, maxCount: 4 }] : [],
                        monster: d.monsterSpawn !== false ? [{ type: 'minecraft:zombie', weight: 95, minCount: 4, maxCount: 4 }] : []
                    },
                    spawn_costs: {}
                };
            } else if (file.categoryId === 'structure_set') {
                obj = {
                    structures: [
                        {
                            structure: d.structure || `${file.namespace}:${file.name}`,
                            weight: 1
                        }
                    ],
                    placement: {
                        type: 'minecraft:random_spread',
                        spacing: Number(d.spacing) || 32,
                        separation: Number(d.separation) || 8,
                        salt: Number(d.salt) || 165745296,
                        spread_type: d.spreadType || 'linear'
                    }
                };
            } else if (file.categoryId === 'damage_type') {
                obj = {
                    message_id: d.message_id || `${file.namespace}.${file.name}`,
                    exhaustion: Number(d.exhaustion ?? 0.1),
                    scaling: d.scaling || 'when_caused_by_living_non_player',
                    effects: d.effects || 'hurt',
                    death_message_type: d.death_message_type || 'default'
                };
            } else if (file.categoryId === 'trim_pattern') {
                obj = {
                    asset_id: d.asset_id || `${file.namespace}:${file.name}`,
                    template_item: d.template_item || 'minecraft:coast_armor_trim_smithing_template',
                    description: { text: d.description || '커스텀 갑옷 장식' },
                    decal: Boolean(d.decal)
                };
            } else if (file.categoryId === 'enchantment') {
                const slots = Array.isArray(d.slots) && d.slots.length > 0 ? d.slots : ['mainhand'];
                obj = {
                    description: { text: d.description || '커스텀 마법 부여' },
                    supported_items: d.supported_items || '#minecraft:enchantable/weapon',
                    weight: Number(d.weight) || 5,
                    max_level: Number(d.max_level) || 3,
                    min_cost: {
                        base: Number(d.min_cost_base) || 1,
                        per_level_above_first: Number(d.min_cost_per_level) || 10
                    },
                    max_cost: {
                        base: Number(d.max_cost_base) || 20,
                        per_level_above_first: Number(d.max_cost_per_level) || 10
                    },
                    anvil_cost: Number(d.anvil_cost) || 2,
                    slots,
                    effects: {}
                };
            } else if (file.categoryId === 'jukebox_song') {
                obj = {
                    sound_event: { sound_id: d.sound_event || 'minecraft:music_disc.pigstep' },
                    description: { text: d.description || '커스텀 음반 트랙' },
                    length_in_seconds: Number(d.length_in_seconds) || 120.0,
                    comparator_output: Number(d.comparator_output ?? 15)
                };
            } else if (file.categoryId === 'wolf_variant') {
                const biomeId = d.biome || 'minecraft:snowy_taiga';
                const spawnObj = versionObj.major >= 48
                    ? { condition: { type: 'minecraft:biome', biomes: biomeId } }
                    : { biomes: biomeId };
                obj = {
                    wild_texture: d.wild_texture || 'minecraft:entity/wolf/wolf_ashen',
                    tame_texture: d.tame_texture || 'minecraft:entity/wolf/wolf_ashen_tame',
                    angry_texture: d.angry_texture || 'minecraft:entity/wolf/wolf_ashen_angry',
                    spawn_conditions: [spawnObj]
                };
            } else if (file.categoryId === 'dialog') {
                const dtype = d.dialogType || 'minecraft:notice';
                obj = {
                    type: dtype,
                    title: { text: d.title || '다이얼로그' },
                    can_close_with_escape: d.canCloseWithEscape !== false,
                    pause: d.pause !== false
                };
                if (d.externalTitle && d.externalTitle.trim()) {
                    obj.external_title = { text: d.externalTitle.trim() };
                }
                if (d.afterAction && d.afterAction !== 'close') {
                    obj.after_action = d.afterAction;
                }
                if (Array.isArray(d.bodyElements) && d.bodyElements.length > 0) {
                    obj.body = d.bodyElements.map(b => {
                        if (b.type === 'minecraft:item') {
                            return {
                                type: 'minecraft:item',
                                item: { id: b.itemId || 'minecraft:diamond', count: Number(b.count) || 1 },
                                description: b.contents ? { text: b.contents } : undefined,
                                show_decorations: b.showDecorations !== false,
                                show_tooltip: b.showTooltip !== false
                            };
                        }
                        return {
                            type: 'minecraft:plain_message',
                            contents: { text: b.contents || '' },
                            width: Number(b.width) || 200
                        };
                    });
                }
                if (Array.isArray(d.inputs) && d.inputs.length > 0) {
                    obj.inputs = d.inputs.map(inp => {
                        const base = {
                            type: inp.type || 'minecraft:text',
                            key: inp.key || 'input_key',
                            label: { text: inp.label || '입력' }
                        };
                        if (inp.type === 'minecraft:text') {
                            base.width = Number(inp.width) || 200;
                            if (inp.initial) base.initial = inp.initial;
                            if (inp.maxLength) base.max_length = Number(inp.maxLength);
                        } else if (inp.type === 'minecraft:boolean') {
                            base.initial = Boolean(inp.initialBool);
                            if (inp.onTrue) base.on_true = inp.onTrue;
                            if (inp.onFalse) base.on_false = inp.onFalse;
                        } else if (inp.type === 'minecraft:number_range') {
                            base.start = Number(inp.start ?? 0);
                            base.end = Number(inp.end ?? 100);
                            if (inp.step) base.step = Number(inp.step);
                            if (inp.initialNum !== undefined && inp.initialNum !== '') base.initial = Number(inp.initialNum);
                        } else if (inp.type === 'minecraft:single_option') {
                            const opts = (inp.optionsRaw || 'opt1:옵션 1,opt2:옵션 2')
                                .split(',')
                                .map(s => {
                                    const [oid, odisp] = s.split(':');
                                    return { id: (oid || '').trim(), display: { text: (odisp || oid || '').trim() } };
                                })
                                .filter(o => o.id);
                            base.options = opts.length ? opts : [{ id: 'default', display: { text: '기본' } }];
                        }
                        return base;
                    });
                }
                if (dtype === 'minecraft:notice') {
                    const act = buildDialogActionObj(d.actionType, d.actionValue);
                    obj.action = { label: { text: d.actionLabel || '확인' }, ...(act ? { action: act } : {}) };
                } else if (dtype === 'minecraft:confirmation') {
                    const yesAct = buildDialogActionObj(d.yesActionType, d.yesActionValue);
                    const noAct = buildDialogActionObj(d.noActionType, d.noActionValue);
                    obj.yes = { label: { text: d.yesLabel || '예' }, ...(yesAct ? { action: yesAct } : {}) };
                    obj.no = { label: { text: d.noLabel || '아니오' }, ...(noAct ? { action: noAct } : {}) };
                } else if (dtype === 'minecraft:multi_action') {
                    obj.columns = Number(d.columns) || 2;
                    obj.actions = (Array.isArray(d.multiActions) ? d.multiActions : []).map(ma => {
                        const act = buildDialogActionObj(ma.actionType, ma.actionValue);
                        return { label: { text: ma.label || '버튼' }, ...(act ? { action: act } : {}) };
                    });
                } else if (dtype === 'minecraft:dialog_list') {
                    obj.dialogs = Array.isArray(d.dialogsList) ? d.dialogsList : [];
                }
                const exitAct = buildDialogActionObj(d.exitActionType, d.exitActionValue);
                if (exitAct || d.exitLabel) {
                    obj.exit_action = { label: { text: d.exitLabel || '닫기' }, ...(exitAct ? { action: exitAct } : {}) };
                }
            } else {
                obj = d;
            }
            return JSON.stringify(obj, null, 2);
        }

        function getCurrentVersion() {
            return MC_VERSIONS.find(v => v.id === state.selectedVersionId) || MC_VERSIONS[0];
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const t = document.createElement('div');
            t.className = 'px-4 py-2.5 rounded-xl border bg-emerald-950/95 border-emerald-500/50 text-emerald-200 text-xs font-semibold shadow-xl backdrop-blur-md';
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function initDefaultProject() {
            const v = getCurrentVersion();
            state.files = [{
                id: 'pack.mcmeta',
                categoryId: 'pack_meta',
                namespace: 'minecraft',
                name: 'pack',
                data: {},
                rawText: JSON.stringify(generatePackMcmetaObj(v), null, 2)
            }];
            state.activeFileId = 'pack.mcmeta';
        }

        function renderVersionDropdown() {
            document.getElementById('versionSelect').innerHTML = MC_VERSIONS.map(v =>
                `<option value="${v.id}" ${v.id === state.selectedVersionId ? 'selected' : ''}>MC ${v.label} (format ${v.major})</option>`
            ).join('');
        }

        function updateVersionHeaderUI() {
            const v = getCurrentVersion();
            document.getElementById('formatBadge').textContent = `pack_format: ${v.major}`;
            document.getElementById('folderModeBadge').textContent = v.major >= 48 ? '단수형 폴더 구조' : '복수형 폴더 구조';
            document.getElementById('fileCountBadge').textContent = state.files.length;
        }

        function switchSidebarTab(tab) {
            document.getElementById('sidebarFilesTab').classList.toggle('hidden', tab !== 'files');
            document.getElementById('sidebarAddTab').classList.toggle('hidden', tab !== 'add');
            document.getElementById('tabBtnFiles').className = tab === 'files' ? 'py-2 rounded-lg font-bold bg-mc-card text-white shadow transition' : 'py-2 rounded-lg font-bold text-gray-400 hover:text-white transition';
            document.getElementById('tabBtnAdd').className = tab === 'add' ? 'py-2 rounded-lg font-bold bg-mc-card text-white shadow transition' : 'py-2 rounded-lg font-bold text-gray-400 hover:text-white transition';
            if (tab === 'add') renderCategoryList();
        }

        function renderUserFileList() {
            const v = getCurrentVersion();
            const container = document.getElementById('userFileListContainer');
            if (!container) return;
            container.innerHTML = state.files.map(f => `
                <div onclick="selectFile('${f.id}')" class="group flex items-center justify-between gap-2 px-3 py-2 rounded-xl border cursor-pointer transition ${f.id === state.activeFileId ? 'bg-emerald-950/50 border-emerald-500/60 text-emerald-200' : 'bg-mc-bg hover:bg-mc-card border-mc-border text-gray-300'}">
                    <div class="truncate font-semibold text-[11px]">${escapeHtml(resolveFilePath(f, v))}</div>
                    ${f.id !== 'pack.mcmeta' ? `<button onclick="event.stopPropagation(); deleteFile('${f.id}')" class="text-rose-400 text-[11px] cursor-pointer">✕</button>` : ''}
                </div>
            `).join('');
        }

        function renderCategoryList() {
            const v = getCurrentVersion();
            const container = document.getElementById('categoryList');
            if (!container) return;
            const available = FEATURE_CATEGORIES.filter(c => v.major >= c.minFormat && (state.activeGroupFilter === 'all' || c.group === state.activeGroupFilter));
            document.getElementById('availableCatCount').textContent = `${available.length}개 지원`;
            container.innerHTML = available.map(cat => `
                <button type="button" onclick="openCreateFileModal('${cat.id}')" class="w-full text-left p-2.5 rounded-xl bg-mc-bg hover:bg-mc-card border border-mc-border hover:border-emerald-500/50 transition flex items-center gap-2.5 cursor-pointer">
                    <span class="text-base">${cat.icon}</span>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold text-gray-100 truncate">${escapeHtml(cat.name)}</div>
                        <div class="text-[10px] text-gray-400 truncate">${escapeHtml(cat.desc)}</div>
                    </div>
                    <span class="text-emerald-400 text-xs font-bold">+</span>
                </button>
            `).join('');
        }

        let pendingCategoryId = null;

        function openCreateFileModal(categoryId) {
            const cat = FEATURE_CATEGORIES.find(c => c.id === categoryId);
            if (!cat) return;
            pendingCategoryId = categoryId;
            document.getElementById('modalCategoryTitle').textContent = `${cat.icon} ${cat.name} 추가`;
            document.getElementById('modalCategoryDesc').textContent = cat.desc;

            const nsInput = document.getElementById('modalNamespaceInput');
            const nameInput = document.getElementById('modalFileNameInput');
            const subWrapper = document.getElementById('modalSubfolderWrapper');
            const tagSelect = document.getElementById('modalTagTypeSelect');

            if (cat.isSystemTag) {
                nsInput.value = 'minecraft';
                nsInput.disabled = true;
                nameInput.value = cat.fixedName;
                nameInput.disabled = true;
            } else {
                nsInput.value = state.defaultNamespace;
                nsInput.disabled = false;
                nameInput.value = `custom_${cat.id}`;
                nameInput.disabled = false;
            }

            if (cat.id === 'tags') {
                subWrapper.classList.remove('hidden');
                tagSelect.innerHTML = `
                    <option value="block">블록 태그 (block)</option>
                    <option value="item">아이템 태그 (item)</option>
                    <option value="entity_type">엔티티 태그 (entity_type)</option>
                    <option value="function">함수 태그 (function)</option>
                `;
            } else {
                subWrapper.classList.add('hidden');
            }

            updateModalPreviewPath();
            const modal = document.getElementById('newFileModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCreateFileModal() {
            const modal = document.getElementById('newFileModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingCategoryId = null;
        }

        function updateModalPreviewPath() {
            if (!pendingCategoryId) return;
            const v = getCurrentVersion();
            const cat = FEATURE_CATEGORIES.find(c => c.id === pendingCategoryId);
            const ns = document.getElementById('modalNamespaceInput').value.trim() || 'custom_pack';
            const name = document.getElementById('modalFileNameInput').value.trim() || 'example';
            const subTag = document.getElementById('modalTagTypeSelect').value;

            const mockFile = {
                id: 'preview',
                categoryId: cat.isSystemTag ? pendingCategoryId : pendingCategoryId,
                namespace: ns,
                name: name,
                subTagType: subTag
            };
            document.getElementById('modalPreviewPath').textContent = `생성 경로: ${resolveFilePath(mockFile, v)}`;
        }

        function confirmCreateFile() {
            if (!pendingCategoryId) return;
            const v = getCurrentVersion();
            const cat = FEATURE_CATEGORIES.find(c => c.id === pendingCategoryId);
            const ns = document.getElementById('modalNamespaceInput').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'custom_pack';
            const name = document.getElementById('modalFileNameInput').value.trim().toLowerCase().replace(/[^a-z0-9_/-]/g, '') || 'example';
            const subTag = document.getElementById('modalTagTypeSelect').value;

            const actualCatId = pendingCategoryId;
            const newId = `${actualCatId}_${ns}_${name}_${Date.now()}`;
            const data = createDefaultFileData(pendingCategoryId, ns, name, v);
            const newFile = {
                id: newId,
                categoryId: actualCatId,
                namespace: ns,
                name: name,
                subTagType: subTag,
                data
            };
            newFile.rawText = serializeFileToText(newFile, v);

            state.files.push(newFile);
            state.activeFileId = newId;
            closeCreateFileModal();
            switchSidebarTab('files');
            refreshAllUI();
            showToast(`${resolveFilePath(newFile, v)} 파일이 생성되었습니다.`);
        }

        function refreshAllUI() {
            updateVersionHeaderUI();
            renderUserFileList();
            renderCategoryList();
            renderVisualBuilder();
        }

        function selectFile(fileId) {
            state.activeFileId = fileId;
            renderUserFileList();
            renderVisualBuilder();
        }

        function deleteFile(fileId) {
            if (fileId === 'pack.mcmeta') return;
            state.files = state.files.filter(f => f.id !== fileId);
            if (state.activeFileId === fileId) state.activeFileId = 'pack.mcmeta';
            refreshAllUI();
            showToast('파일이 삭제되었습니다.');
        }

        function handleFieldInput(key, val) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file) return;
            if (file.id === 'pack.mcmeta') {
                if (key === 'packDescription') state.packDescription = val;
                file.rawText = serializeFileToText(file, getCurrentVersion());
                return;
            }
            file.data[key] = val;
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        // Tag value helpers
        function addTagValue(fileId) {
            const file = state.files.find(f => f.id === fileId);
            if (!file) return;
            if (!Array.isArray(file.data.values)) file.data.values = [];
            const tagType = file.categoryId === 'tags' ? (file.subTagType || 'block') : 'function';
            const defaults = {
                block: 'minecraft:stone',
                item: 'minecraft:diamond',
                entity_type: 'minecraft:zombie',
                function: `${state.defaultNamespace}:main`
            };
            file.data.values.push(defaults[tagType] || 'minecraft:stone');
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderVisualBuilder();
        }

        function updateTagSubType(fileId, newSubType) {
            const file = state.files.find(f => f.id === fileId);
            if (!file || file.categoryId !== 'tags') return;
            file.subTagType = newSubType;
            file.rawText = serializeFileToText(file, getCurrentVersion());
            document.getElementById('editorFilePath').textContent = resolveFilePath(file, getCurrentVersion());
            renderUserFileList();
            renderVisualBuilder();
        }

        function updateTagValueInput(fileId, idx, val) {
            const file = state.files.find(f => f.id === fileId);
            if (!file) return;
            if (!Array.isArray(file.data.values)) file.data.values = [];
            file.data.values[idx] = val.trim();
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        function updateTagValueSelect(fileId, idx, val) {
            if (!val) return;
            const file = state.files.find(f => f.id === fileId);
            if (!file) return;
            if (!Array.isArray(file.data.values)) file.data.values = [];
            file.data.values[idx] = val;
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderVisualBuilder();
        }

        function removeTagValue(fileId, idx) {
            const file = state.files.find(f => f.id === fileId);
            if (!file || !Array.isArray(file.data.values)) return;
            file.data.values.splice(idx, 1);
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderVisualBuilder();
        }

        function addPredicateTerm() {

            if (!file || file.categoryId !== 'predicate' || !Array.isArray(file.data.terms) || !file.data.terms[idx]) return;

            const file = state.files.find(f => f.id === state.activeFileId);

            if (!file.data.term || typeof file.data.term !== 'object') {

        function getActiveDialogFile() {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file || file.categoryId !== 'dialog') return null;
            return file;
        }

        function syncDialogFile(file) {
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderVisualBuilder();
        }

        function addDialogBody(type) {
            const file = getActiveDialogFile();
            if (!file) return;
            if (!Array.isArray(file.data.bodyElements)) file.data.bodyElements = [];
            if (type === 'minecraft:item') {
                file.data.bodyElements.push({ type: 'minecraft:item', itemId: 'minecraft:diamond', count: 1, contents: '아이템 설명' });
            } else {
                file.data.bodyElements.push({ type: 'minecraft:plain_message', contents: '새 본문 메시지', width: 200 });
            }
            syncDialogFile(file);
        }

        function updateDialogBody(idx, key, val) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.bodyElements) || !file.data.bodyElements[idx]) return;
            file.data.bodyElements[idx][key] = val;
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        function removeDialogBody(idx) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.bodyElements)) return;
            file.data.bodyElements.splice(idx, 1);
            syncDialogFile(file);
        }

        function addDialogInput() {
            const file = getActiveDialogFile();
            if (!file) return;
            if (!Array.isArray(file.data.inputs)) file.data.inputs = [];
            file.data.inputs.push({ type: 'minecraft:text', key: `field_${file.data.inputs.length + 1}`, label: '입력 항목', initial: '', width: 200 });
            syncDialogFile(file);
        }

        function updateDialogInput(idx, key, val) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.inputs) || !file.data.inputs[idx]) return;
            file.data.inputs[idx][key] = val;
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        function removeDialogInput(idx) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.inputs)) return;
            file.data.inputs.splice(idx, 1);
            syncDialogFile(file);
        }

        function addDialogMultiAction() {
            const file = getActiveDialogFile();
            if (!file) return;
            if (!Array.isArray(file.data.multiActions)) file.data.multiActions = [];
            file.data.multiActions.push({ label: `버튼 ${file.data.multiActions.length + 1}`, actionType: 'run_command', actionValue: 'say 클릭됨' });
            syncDialogFile(file);
        }

        function updateDialogMultiAction(idx, key, val) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.multiActions) || !file.data.multiActions[idx]) return;
            file.data.multiActions[idx][key] = val;
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        function removeDialogMultiAction(idx) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.multiActions)) return;
            file.data.multiActions.splice(idx, 1);
            syncDialogFile(file);
        }

        function addDialogListEntry() {
            const file = getActiveDialogFile();
            if (!file) return;
            if (!Array.isArray(file.data.dialogsList)) file.data.dialogsList = [];
            file.data.dialogsList.push(`${state.defaultNamespace}:sub_dialog`);
            syncDialogFile(file);
        }

        function updateDialogListEntry(idx, val) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.dialogsList)) return;
            file.data.dialogsList[idx] = val.trim();
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        function removeDialogListEntry(idx) {
            const file = getActiveDialogFile();
            if (!file || !Array.isArray(file.data.dialogsList)) return;
            file.data.dialogsList.splice(idx, 1);
            syncDialogFile(file);
        }

        function updatePath(nsId, nameId) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file) return;
            const nsVal = document.getElementById(nsId)?.value.trim() || 'custom_pack';
            const nameVal = document.getElementById(nameId)?.value.trim() || 'file';
            file.namespace = nsVal;
            file.name = nameVal;
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderUserFileList();
        }

        function updateRecipeGridInput(idx, val) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file || file.categoryId !== 'recipe') return;
            if (!file.data.gridItems) file.data.gridItems = Array(9).fill('');
            file.data.gridItems[idx] = val.trim();
            file.rawText = serializeFileToText(file, getCurrentVersion());
        }

        let pendingItemTarget = null;
        function openItemPicker(mode, idx) {
            pendingItemTarget = { mode, idx };
            document.getElementById('itemPickerVersionBadge').textContent = `MC ${getCurrentVersion().id}`;
            renderItemPickerGrid();
            document.getElementById('itemPickerModal').classList.remove('hidden');
            document.getElementById('itemPickerModal').classList.add('flex');
        }
        function closeItemPicker() {
            document.getElementById('itemPickerModal').classList.add('hidden');
            document.getElementById('itemPickerModal').classList.remove('flex');
        }
        function renderItemPickerGrid() {
            const query = (document.getElementById('itemSearchInput').value || '').toLowerCase();
            const cat = document.getElementById('itemPickerCatFilter')?.value || 'all';
            const filtered = MC_ITEMS_DB.filter(i =>
                (cat === 'all' || i.cat === cat) &&
                (!query || i.name.toLowerCase().includes(query) || i.id.toLowerCase().includes(query))
            );
            document.getElementById('itemPickerGrid').innerHTML = filtered.map(item => `
                <button type="button" onclick="selectPickedItem('${item.id}')" class="flex flex-col items-center gap-1.5 p-2.5 rounded-xl bg-mc-bg hover:bg-mc-card border border-mc-border hover:border-emerald-500 transition text-center cursor-pointer">
                    ${renderItemIconHtml(item.id, 'w-10 h-10')}
                    <span class="text-[11px] font-semibold text-gray-200 truncate w-full">${escapeHtml(item.name)}</span>
                    <span class="text-[9px] font-mono text-gray-400 truncate w-full">${escapeHtml(item.id)}</span>
                </button>
            `).join('');
        }
        function selectPickedItem(itemId) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (file) {
                if (pendingItemTarget?.mode === 'loot_item') {
                    file.data.item = itemId;
                } else if (pendingItemTarget?.mode === 'recipe_result') {
                    file.data.resultItem = itemId;
                } else if (pendingItemTarget?.mode === 'recipe_grid') {
                    if (!file.data.gridItems) file.data.gridItems = Array(9).fill('');
                    file.data.gridItems[pendingItemTarget.idx] = itemId;
                }
                file.rawText = serializeFileToText(file, getCurrentVersion());
            }
            closeItemPicker();
            renderVisualBuilder();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderVersionDropdown();
            initDefaultProject();
            refreshAllUI();

            document.getElementById('btnPackSettings')?.addEventListener('click', () => selectFile('pack.mcmeta'));
            document.getElementById('btnCloseModal').addEventListener('click', closeCreateFileModal);
            document.getElementById('btnCancelModal').addEventListener('click', closeCreateFileModal);
            document.getElementById('btnConfirmCreateFile').addEventListener('click', confirmCreateFile);
            document.getElementById('modalNamespaceInput').addEventListener('input', updateModalPreviewPath);
            document.getElementById('modalFileNameInput').addEventListener('input', updateModalPreviewPath);
            document.getElementById('modalTagTypeSelect').addEventListener('input', updateModalPreviewPath);

            document.querySelectorAll('.cat-group-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.cat-group-btn').forEach(b => b.className = 'cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white');
                    e.currentTarget.className = 'cat-group-btn flex-1 py-1.5 rounded-lg font-semibold bg-mc-card text-white shadow';
                    state.activeGroupFilter = e.currentTarget.dataset.group;
                    renderCategoryList();
                });
            });

            document.getElementById('versionSelect').addEventListener('change', (e) => {
                state.selectedVersionId = e.target.value;
                const v = getCurrentVersion();
                state.files.forEach(f => f.rawText = serializeFileToText(f, v));
                refreshAllUI();
                showToast(`버전이 MC ${v.id}(으)로 변경되었습니다.`);
            });

            document.getElementById('btnExportZip').addEventListener('click', async () => {
                if (typeof JSZip === 'undefined') return showToast('ZIP 라이브러리 로드 실패');
                const zip = new JSZip();
                const v = getCurrentVersion();
                state.files.forEach(f => zip.file(resolveFilePath(f, v), f.rawText || ''));
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${state.defaultNamespace}_datapack.zip`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('데이터팩 .ZIP 다운로드 완료!');
            });
        });
    </script>
