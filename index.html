        /**
         * 상태 객체(file.data) -> 실제 마인크래프트 JSON / .mcfunction 문자열 변환
         * (버전에 따라 키 구조 자동 변환: 예 - 레시피 result.item vs result.id, 1.20.5+ 컴포넌트 등)
         */
        function serializeFileToText(file, versionObj) {
            if (file.id === 'pack.mcmeta') {
                return JSON.stringify(generatePackMcmetaObj(versionObj), null, 2);
            }

            if (file.categoryId === 'function') {
                return file.data.commands || '';
            }

            const d = file.data;
            let outputObj = {};

            switch (file.categoryId) {
                case 'load_tick':
                case 'tags':
                    outputObj = {
                        replace: Boolean(d.replace),
                        values: Array.isArray(d.values) ? d.values : []
                    };
                    break;

                case 'recipe': {
                    // 1.20.5 (포맷 41)부터 레시피 결과물의 "item" 키가 "id"로 변경됨!
                    const resultKey = versionObj.major >= 41 ? 'id' : 'item';
                    const grid = Array.isArray(d.gridItems) ? d.gridItems : Array(9).fill('');

                    if (d.recipeType === 'minecraft:crafting_shaped') {
                        // 9칸 슬롯의 아이템들로부터 자동으로 pattern & key 딕셔너리 생성
                        const symbolPool = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
                        const itemToSym = {};
                        const keyObj = {};
                        let symIdx = 0;

                        const patternRows = [];
                        for (let r = 0; r < 3; r++) {
                            let rowStr = '';
                            for (let c = 0; c < 3; c++) {
                                const item = (grid[r * 3 + c] || '').trim();
                                if (!item) {
                                    rowStr += ' ';
                                } else {
                                    if (!itemToSym[item]) {
                                        const sym = symbolPool[symIdx++];
                                        itemToSym[item] = sym;
                                        keyObj[sym] = versionObj.major >= 57 ? item : { item };
                                    }
                                    rowStr += itemToSym[item];
                                }
                            }
                            patternRows.push(rowStr);
                        }

                        outputObj = {
                            type: 'minecraft:crafting_shaped',
                            pattern: patternRows,
                            key: keyObj,
                            result: {
                                [resultKey]: d.resultItem || 'minecraft:stone',
                                count: Number(d.resultCount) || 1
                            }
                        };
                    } else if (d.recipeType === 'minecraft:crafting_shapeless') {
                        const ingList = grid
                            .map(v => (v || '').trim())
                            .filter(Boolean)
                            .map(v => versionObj.major >= 57 ? v : { item: v });
                        outputObj = {
                            type: 'minecraft:crafting_shapeless',
                            ingredients: ingList.length ? ingList : [versionObj.major >= 57 ? 'minecraft:dirt' : { item: 'minecraft:dirt' }],
                            result: {
                                [resultKey]: d.resultItem || 'minecraft:stone',
                                count: Number(d.resultCount) || 1
                            }
                        };
                    } else {
                        // 화로 / 훈연기 / 용광로
                        outputObj = {
                            type: d.recipeType,
                            ingredient: versionObj.major >= 57 ? (d.ingredient || 'minecraft:raw_iron') : { item: d.ingredient || 'minecraft:raw_iron' },
                            result: versionObj.major >= 41
                                ? { id: d.resultItem || 'minecraft:iron_ingot' }
                                : (d.resultItem || 'minecraft:iron_ingot'),
                            experience: Number(d.experience) || 0.7,
                            cookingtime: Number(d.cookingTime) || 200
                        };
                    }
                    break;
                }

                case 'loot_table':
                    outputObj = {
                        type: d.lootType || 'minecraft:entity',
                        pools: [
                            {
                                rolls: Number(d.rolls) || 1,
                                entries: [
                                    {
                                        type: 'minecraft:item',
                                        name: d.item || 'minecraft:diamond',
                                        functions: [
                                            {
                                                function: 'minecraft:set_count',
                                                count: {
                                                    min: Number(d.minCount) || 1,
                                                    max: Number(d.maxCount) || 1
                                                }
                                            }
                                        ]
                                    }
                                ],
                                conditions: [
                                    {
                                        condition: 'minecraft:random_chance',
                                        chance: Number(d.chance) ?? 1.0
                                    }
                                ]
                            }
                        ]
                    };
                    break;

                case 'advancement': {
                    // 1.20.5 (포맷 41)부터 icon의 "item" 키가 "id"로 변경됨!
                    const iconKey = versionObj.major >= 41 ? 'id' : 'item';
                    outputObj = {
                        display: {
                            icon: { [iconKey]: d.iconItem || 'minecraft:nether_star' },
                            title: { text: d.title || '발전 과제' },
                            description: { text: d.description || '설명' },
                            frame: d.frame || 'task',
                            show_toast: Boolean(d.showToast),
                            announce_to_chat: Boolean(d.announceToChat)
                        },
                        criteria: {
                            requirement: {
                                trigger: d.trigger || 'minecraft:tick'
                            }
                        }
                    };
                    if (d.rewardFunction && d.rewardFunction.trim()) {
                        outputObj.rewards = { function: d.rewardFunction.trim() };
                    }
                    break;
                }

                case 'predicate':
                    outputObj = {
                        condition: d.condition || 'minecraft:weather_check',
                        raining: Boolean(d.raining),
                        thundering: Boolean(d.thundering)
                    };
                    break;

                case 'item_modifier':
                    outputObj = {
                        function: 'minecraft:set_name',
                        entity: 'this',
                        name: {
                            text: d.customName || '커스텀 아이템',
                            color: d.color || 'gold',
                            italic: false
                        }
                    };
                    break;

                case 'dimension':
                    outputObj = {
                        type: d.type || 'minecraft:overworld',
                        generator: {
                            type: 'minecraft:noise',
                            settings: 'minecraft:overworld',
                            biome_source: {
                                type: 'minecraft:fixed',
                                biome: d.biome || 'minecraft:plains'
                            }
                        }
                    };
                    break;

                case 'worldgen_biome':
                    outputObj = {
                        has_precipitation: Boolean(d.has_precipitation),
                        temperature: Number(d.temperature) || 0.8,
                        downfall: Number(d.downfall) || 0.4,
                        effects: {
                            sky_color: Number(d.sky_color) || 7907327,
                            fog_color: Number(d.fog_color) || 12638463,
                            water_color: Number(d.water_color) || 4159204,
                            water_fog_color: Number(d.water_fog_color) || 329011
                        },
                        spawners: {},
                        spawn_costs: {},
                        carvers: {},
                        features: []
                    };
                    break;

                case 'structure_set':
                    outputObj = {
                        structures: [
                            {
                                structure: `${file.namespace}:${file.name}`,
                                weight: 1
                            }
                        ],
                        placement: {
                            type: 'minecraft:random_spread',
                            spacing: Number(d.spacing) || 32,
                            separation: Number(d.separation) || 8,
                            salt: Number(d.salt) || 14357617
                        }
                    };
                    break;

                case 'damage_type':
                    outputObj = {
                        message_id: d.message_id || `${file.namespace}.custom`,
                        scaling: d.scaling || 'when_caused_by_living_non_player',
                        exhaustion: Number(d.exhaustion) || 0.1
                    };
                    break;

                case 'trim_pattern':
                    outputObj = {
                        asset_id: d.asset_id || `${file.namespace}:${file.name}`,
                        template_item: d.template_item || 'minecraft:coast_armor_trim_smithing_template',
                        description: {
                            text: d.descriptionText || '커스텀 갑옷 장식'
                        },
                        decal: false
                    };
                    break;

                case 'enchantment':
                    outputObj = {
                        description: { text: d.descriptionText || '커스텀 인챈트' },
                        supported_items: d.supportedItems || '#minecraft:enchantable/sword',
                        weight: Number(d.weight) || 5,
                        max_level: Number(d.maxLevel) || 3,
                        min_cost: { base: 10, per_level_above_first: 10 },
                        max_cost: { base: 40, per_level_above_first: 10 },
                        anvil_cost: Number(d.anvilCost) || 4,
                        slots: ['mainhand']
                    };
                    break;

                case 'jukebox_song':
                    outputObj = {
                        sound_event: d.soundEvent || 'minecraft:music_disc.pigstep',
                        description: { text: d.descriptionText || '커스텀 음반' },
                        length_in_seconds: Number(d.lengthInSeconds) || 120.0,
                        comparator_output: Number(d.comparatorOutput) || 15
                    };
                    break;

                case 'wolf_variant':
                    outputObj = {
                        wild_texture: d.wildTexture || 'minecraft:entity/wolf/wolf_ashen',
                        tame_texture: d.tameTexture || 'minecraft:entity/wolf/wolf_ashen_tame',
                        angry_texture: d.angryTexture || 'minecraft:entity/wolf/wolf_ashen_angry',
                        biomes: d.biomes || 'minecraft:grove'
                    };
                    break;

                case 'dialog':
                    outputObj = {
                        type: 'minecraft:notice',
                        title: { text: d.title || '알림' },
                        body: [
                            {
                                type: 'minecraft:plain_message',
                                contents: { text: d.bodyText || '내용' }
                            }
                        ],
                        action: {
                            label: { text: d.buttonLabel || '확인' }
                        }
                    };
                    break;

                default:
                    outputObj = d;
            }

            return JSON.stringify(outputObj, null, 2);
        }

        /**
         * ============================================================================
         * 5. 초기 스타터 프로젝트 구성 (기본 생성 파일 최소화 및 깔끔한 시작)
         * ============================================================================
         */
        function initDefaultProject() {
            const v = MC_VERSIONS.find(ver => ver.id === state.selectedVersionId) || MC_VERSIONS[0];
            state.files = [
                {
                    id: 'pack.mcmeta',
                    categoryId: 'pack_meta',
                    namespace: 'minecraft',
                    name: 'pack',
                    data: {},
                    rawText: JSON.stringify(generatePackMcmetaObj(v), null, 2)
                }
            ];
            state.activeFileId = 'pack.mcmeta';
        }

        function getCurrentVersion() {
            return MC_VERSIONS.find(v => v.id === state.selectedVersionId) || MC_VERSIONS[0];
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const colorClass = type === 'error'
                ? 'bg-rose-950/95 border-rose-500/50 text-rose-200'
                : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200';
            toast.className = `px-4 py-2.5 rounded-xl border shadow-xl text-xs font-semibold backdrop-blur-md transition-all duration-300 ${colorClass}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        function renderVersionDropdown() {
            const select = document.getElementById('versionSelect');
            if (!select) return;
            select.innerHTML = MC_VERSIONS.map(v =>
                `<option value="${v.id}" ${v.id === state.selectedVersionId ? 'selected' : ''}>MC ${v.label}</option>`
            ).join('');
        }

        function updateVersionHeaderUI() {
            const v = getCurrentVersion();
            const formatBadge = document.getElementById('formatBadge');
            const folderBadge = document.getElementById('folderModeBadge');
            const noticeText = document.getElementById('versionNoticeText');
            const nsDisplay = document.getElementById('headerNamespaceDisplay');
            const fileCount = document.getElementById('headerFileCount');

            if (formatBadge) {
                formatBadge.textContent = v.major >= 88
                    ? `format: ${v.format} (min/max)`
                    : `pack_format: ${v.major}`;
            }
            if (folderBadge) {
                folderBadge.textContent = v.major >= 48
                    ? '단수 폴더 (function, recipe...)'
                    : '복수 폴더 (functions, recipes...)';
            }
            if (noticeText) noticeText.textContent = `[MC ${v.id}] ${v.note}`;
            if (nsDisplay) nsDisplay.textContent = state.defaultNamespace;
            if (fileCount) fileCount.textContent = state.files.length;
        }

        let sidebarActiveTab = 'files'; // 'files' or 'add'

        function switchSidebarTab(tab) {
            sidebarActiveTab = tab;
            const filesTab = document.getElementById('sidebarFilesTab');
            const addTab = document.getElementById('sidebarAddTab');
            const btnFiles = document.getElementById('tabBtnFiles');
            const btnAdd = document.getElementById('tabBtnAdd');

            if (tab === 'files') {
                filesTab.classList.remove('hidden');
                addTab.classList.add('hidden');
                btnFiles.className = 'py-2 rounded-lg font-bold bg-mc-card text-white shadow transition';
                btnAdd.className = 'py-2 rounded-lg font-bold text-gray-400 hover:text-white transition';
            } else {
                filesTab.classList.add('hidden');
                addTab.classList.remove('hidden');
                btnAdd.className = 'py-2 rounded-lg font-bold bg-mc-card text-white shadow transition';
                btnFiles.className = 'py-2 rounded-lg font-bold text-gray-400 hover:text-white transition';
            }
        }

        function renderUserFileList() {
            const v = getCurrentVersion();
            const container = document.getElementById('userFileListContainer');
            const badge = document.getElementById('fileCountBadge');
            if (badge) badge.textContent = state.files.length;
            if (!container) return;

            container.innerHTML = state.files.map(file => {
                const isActive = file.id === state.activeFileId;
                const fullPath = resolveFilePath(file, v);
                const isMeta = file.id === 'pack.mcmeta';
                return `
                    <div onclick="selectFile('${file.id}')"
                        class="group flex items-center justify-between gap-2 px-3 py-2 rounded-xl border cursor-pointer transition ${
                            isActive
                                ? 'bg-emerald-950/50 border-emerald-500/60 text-emerald-200'
                                : 'bg-mc-bg hover:bg-mc-card border-mc-border text-gray-300'
                        }">
                        <div class="min-w-0 flex-1">
                            <div class="truncate font-semibold text-[11px]">${escapeHtml(fullPath)}</div>
                        </div>
                        ${!isMeta ? `
                            <button type="button" onclick="event.stopPropagation(); deleteFile('${file.id}')"
                                title="파일 삭제"
                                class="opacity-60 hover:opacity-100 text-rose-400 hover:text-rose-300 px-1.5 py-0.5 rounded text-[11px]">
                                ✕
                            </button>
                        ` : `<span class="text-[10px] text-gray-500">필수</span>`}
                    </div>
                `;
            }).join('');
        }

        function renderCategoryList() {
            const v = getCurrentVersion();
            const container = document.getElementById('categoryList');
            const countBadge = document.getElementById('availableCatCount');
            if (!container) return;

            const available = FEATURE_CATEGORIES.filter(cat => {
                if (v.major < cat.minFormat) return false;
                if (state.activeGroupFilter !== 'all' && cat.group !== state.activeGroupFilter) return false;
                return true;
            });

            if (countBadge) {
                const totalSupported = FEATURE_CATEGORIES.filter(c => v.major >= c.minFormat).length;
                countBadge.textContent = `${totalSupported}개 지원`;
            }

            container.innerHTML = available.map(cat => `
                <button type="button" onclick="openCreateFileModal('${cat.id}')"
                    class="w-full text-left p-2.5 rounded-xl bg-mc-bg hover:bg-mc-card border border-mc-border hover:border-emerald-500/50 transition flex items-start gap-2.5 cursor-pointer">
                    <span class="text-base leading-none mt-0.5">${cat.icon}</span>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold text-gray-100 truncate">${escapeHtml(cat.name)}</div>
                        <div class="text-[10px] text-gray-400 line-clamp-1 mt-0.5">${escapeHtml(cat.desc)}</div>
                    </div>
                    <span class="text-emerald-400 text-xs font-bold">+</span>
                </button>
            `).join('');
        }

        function refreshAllUI() {
            updateVersionHeaderUI();
            renderUserFileList();
            renderCategoryList();
            renderVisualBuilder();
            renderCodeEditor();
        }

        function selectFile(fileId) {
            state.activeFileId = fileId;
            renderUserFileList();
            renderVisualBuilder();
            renderCodeEditor();
        }

        function deleteFile(fileId) {
            if (fileId === 'pack.mcmeta') return;
            state.files = state.files.filter(f => f.id !== fileId);
            if (state.activeFileId === fileId) {
                state.activeFileId = 'pack.mcmeta';
            }
            refreshAllUI();
            showToast('파일이 삭제되었습니다.');
        }

        function updateActiveFileField(key, value) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file) return;
            file.data[key] = value;
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderCodeEditor();
        }

        function updatePackMetaField(key, value) {
            state[key] = value;
            const packFile = state.files.find(f => f.id === 'pack.mcmeta');
            if (packFile) {
                packFile.rawText = serializeFileToText(packFile, getCurrentVersion());
            }
            refreshAllUI();
        }

        function renderCodeEditor() {
            const file = state.files.find(f => f.id === state.activeFileId);
            const editor = document.getElementById('rawCodeEditor');
            const badge = document.getElementById('codeSyntaxBadge');
            const status = document.getElementById('jsonValidStatus');
            if (!file || !editor) return;

            if (file.rawText === undefined) {
                file.rawText = serializeFileToText(file, getCurrentVersion());
            }
            editor.value = file.rawText;

            if (file.categoryId === 'function') {
                badge.textContent = 'MCFUNCTION';
                status.textContent = `✓ 총 ${file.rawText.split('\n').length}줄 명령어 스크립트`;
                status.className = 'text-emerald-400 font-medium';
            } else {
                badge.textContent = 'JSON';
                try {
                    JSON.parse(file.rawText);
                    status.textContent = '✓ 유효한 JSON 구조입니다';
                    status.className = 'text-emerald-400 font-medium';
                } catch (e) {
                    status.textContent = '⚠️ JSON 문법 오류가 있습니다';
                    status.className = 'text-amber-400 font-medium';
                }
            }
        }

        function renderVisualBuilder() {
            const v = getCurrentVersion();
            const file = state.files.find(f => f.id === state.activeFileId);
            const container = document.getElementById('visualBuilderContainer');
            const badge = document.getElementById('editorCategoryBadge');
            const title = document.getElementById('editorTitle');
            const pathEl = document.getElementById('editorFilePath');
            const delBtn = document.getElementById('btnDeleteCurrentFile');
            if (!file || !container) return;

            pathEl.textContent = resolveFilePath(file, v);
            delBtn.classList.toggle('hidden', file.id === 'pack.mcmeta');

            if (file.id === 'pack.mcmeta') {
                badge.textContent = 'PACK.MCMETA';
                title.textContent = '팩 메타데이터 & 기본 네임스페이스 설정';
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-mc-bg border border-mc-border rounded-xl p-4 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">데이터팩 설명 (description)</label>
                                <input type="text" value="${escapeHtml(state.packDescription)}"
                                    oninput="updatePackMetaField('packDescription', this.value)"
                                    class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">기본 네임스페이스 (Namespace)</label>
                                <input type="text" value="${escapeHtml(state.defaultNamespace)}"
                                    oninput="updatePackMetaField('defaultNamespace', this.value.toLowerCase().replace(/[^a-z0-9_-]/g, ''))"
                                    class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-2 text-xs font-mono text-emerald-300 focus:outline-none focus:border-emerald-500">
                            </div>
                        </div>
                        ${v.major >= 18 ? `
                        <div class="bg-mc-bg border border-mc-border rounded-xl p-4 space-y-3">
                            <label class="flex items-center gap-2 text-xs font-semibold text-gray-200 cursor-pointer">
                                <input type="checkbox" ${state.includeSupportedFormats ? 'checked' : ''}
                                    onchange="updatePackMetaField('includeSupportedFormats', this.checked)"
                                    class="rounded bg-mc-card border-mc-border text-emerald-500">
                                <span>다중 버전 호환 범위 (supported_formats) 포함</span>
                            </label>
                            ${state.includeSupportedFormats ? `
                            <div class="grid grid-cols-2 gap-3 pt-1">
                                <div>
                                    <label class="block text-[11px] text-gray-400 mb-1">최소 포맷 (min_inclusive)</label>
                                    <input type="number" value="${state.minSupportedFormat}"
                                        oninput="updatePackMetaField('minSupportedFormat', this.value)"
                                        class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-1.5 text-xs font-mono text-white">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-gray-400 mb-1">최대 포맷 (max_inclusive)</label>
                                    <input type="number" value="${state.maxSupportedFormat}"
                                        oninput="updatePackMetaField('maxSupportedFormat', this.value)"
                                        class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-1.5 text-xs font-mono text-white">
                                </div>
                            </div>` : ''}
                        </div>` : ''}
                    </div>
                `;
                return;
            }

            const cat = FEATURE_CATEGORIES.find(c => c.id === file.categoryId);
            badge.textContent = (cat ? cat.id : file.categoryId).toUpperCase();
            title.textContent = cat ? cat.name : file.name;
            const d = file.data;

            if (file.categoryId === 'function') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex flex-wrap gap-1.5">
                            <button onclick="appendFunctionCmd('say §a안녕하세요!')" class="px-2.5 py-1 rounded-lg bg-mc-card hover:bg-gray-800 border border-mc-border text-[11px] text-emerald-300 font-mono">+ say</button>
                            <button onclick="appendFunctionCmd('give @s minecraft:diamond 1')" class="px-2.5 py-1 rounded-lg bg-mc-card hover:bg-gray-800 border border-mc-border text-[11px] text-emerald-300 font-mono">+ give</button>
                            <button onclick="appendFunctionCmd('effect give @s minecraft:speed 10 1 true')" class="px-2.5 py-1 rounded-lg bg-mc-card hover:bg-gray-800 border border-mc-border text-[11px] text-emerald-300 font-mono">+ effect</button>
                            <button onclick="appendFunctionCmd('playsound minecraft:entity.experience_orb.pickup master @s')" class="px-2.5 py-1 rounded-lg bg-mc-card hover:bg-gray-800 border border-mc-border text-[11px] text-emerald-300 font-mono">+ playsound</button>
                        </div>
                        <textarea rows="12" oninput="updateActiveFileField('commands', this.value)"
                            class="w-full bg-mc-bg border border-mc-border rounded-xl p-3 font-mono text-xs text-gray-100 focus:outline-none focus:border-emerald-500">${escapeHtml(d.commands || '')}</textarea>
                    </div>
                `;
                return;
            }

            if (file.categoryId === 'load_tag' || file.categoryId === 'tick_tag' || file.categoryId === 'tags') {
                const values = Array.isArray(d.values) ? d.values : [];
                container.innerHTML = `
                    <div class="space-y-3">
                        <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
                            <input type="checkbox" ${d.replace ? 'checked' : ''} onchange="updateActiveFileField('replace', this.checked)">
                            <span>기존 바닐라 태그 덮어쓰기 (replace: true)</span>
                        </label>
                        <div class="bg-mc-bg border border-mc-border rounded-xl p-3 space-y-2">
                            <div class="text-xs font-semibold text-gray-300">등록된 항목 목록 (values)</div>
                            <div class="space-y-1.5">
                                ${values.map((val, idx) => `
                                    <div class="flex items-center gap-2">
                                        <input type="text" value="${escapeHtml(val)}"
                                            onchange="updateTagValue(${idx}, this.value)"
                                            class="flex-1 bg-mc-card border border-mc-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-emerald-300">
                                        <button onclick="removeTagValue(${idx})" class="px-2 py-1 rounded-lg bg-rose-950/70 text-rose-300 text-xs">삭제</button>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="addTagValue()" class="mt-2 px-3 py-1.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-semibold">+ 항목 추가</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (file.categoryId === 'recipe') {
                const grid = Array.isArray(d.gridItems) ? d.gridItems : Array(9).fill('');
                const isShapedOrShapeless = d.recipeType === 'minecraft:crafting_shaped' || d.recipeType === 'minecraft:crafting_shapeless';
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-mc-bg border border-mc-border rounded-xl p-3.5 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">레시피 유형</label>
                                <select onchange="updateActiveFileField('recipeType', this.value); renderVisualBuilder();"
                                    class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-2 text-xs text-white">
                                    <option value="minecraft:crafting_shaped" ${d.recipeType === 'minecraft:crafting_shaped' ? 'selected' : ''}>작업대 - 모양 있는 조합 (Shaped)</option>
                                    <option value="minecraft:crafting_shapeless" ${d.recipeType === 'minecraft:crafting_shapeless' ? 'selected' : ''}>작업대 - 모양 없는 조합 (Shapeless)</option>
                                    <option value="minecraft:smelting" ${d.recipeType === 'minecraft:smelting' ? 'selected' : ''}>화로 제련 (Smelting)</option>
                                    <option value="minecraft:blasting" ${d.recipeType === 'minecraft:blasting' ? 'selected' : ''}>용광로 제련 (Blasting)</option>
                                    <option value="minecraft:smoking" ${d.recipeType === 'minecraft:smoking' ? 'selected' : ''}>훈연기 조리 (Smoking)</option>
                                </select>
                            </div>

                            ${isShapedOrShapeless ? `
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-semibold text-gray-300">3x3 제작대 슬롯 (클릭하여 아이템 선택)</span>
                                    <button onclick="updateActiveFileField('gridItems', Array(9).fill('')); renderVisualBuilder();" class="text-[11px] text-rose-400 hover:underline">전체 비우기</button>
                                </div>
                                <div class="flex flex-wrap items-center justify-center gap-4 bg-mc-card p-4 rounded-xl border border-mc-border">
                                    <div class="grid grid-cols-3 gap-1.5">
                                        ${grid.map((item, idx) => `
                                            <button type="button" onclick="openItemPicker('grid', ${idx})"
                                                title="${escapeHtml(item || '빈 슬롯 (클릭하여 선택)')}"
                                                class="craft-slot w-12 h-12 rounded-xl bg-mc-bg border border-mc-border flex items-center justify-center relative">
                                                ${renderItemIconHtml(item, 'w-8 h-8')}
                                            </button>
                                        `).join('')}
                                    </div>
                                    <span class="text-gray-400 font-bold text-lg">➔</span>
                                    <div class="flex flex-col items-center gap-1.5">
                                        <button type="button" onclick="openItemPicker('result', 0)"
                                            title="${escapeHtml(d.resultItem || '결과 아이템 선택')}"
                                            class="craft-slot w-14 h-14 rounded-xl bg-mc-bg border-2 border-emerald-500/60 flex items-center justify-center">
                                            ${renderItemIconHtml(d.resultItem, 'w-9 h-9')}
                                        </button>
                                        <span class="text-[10px] font-mono text-emerald-300">${escapeHtml((d.resultItem || '').replace('minecraft:', ''))}</span>
                                    </div>
                                </div>
                            </div>
                            ` : `
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-gray-300 mb-1">재료 아이템</label>
                                    <button type="button" onclick="openItemPicker('ingredient', 0)"
                                        class="w-full flex items-center gap-2 bg-mc-card border border-mc-border hover:border-emerald-500 rounded-lg px-3 py-2 text-xs text-white">
                                        ${renderItemIconHtml(d.ingredient, 'w-6 h-6')}
                                        <span class="truncate font-mono">${escapeHtml(d.ingredient || '선택')}</span>
                                    </button>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-300 mb-1">결과 아이템</label>
                                    <button type="button" onclick="openItemPicker('result', 0)"
                                        class="w-full flex items-center gap-2 bg-mc-card border border-mc-border hover:border-emerald-500 rounded-lg px-3 py-2 text-xs text-white">
                                        ${renderItemIconHtml(d.resultItem, 'w-6 h-6')}
                                        <span class="truncate font-mono">${escapeHtml(d.resultItem || '선택')}</span>
                                    </button>
                                </div>
                            </div>
                            `}

                            <div class="grid grid-cols-2 gap-3 pt-1">
                                <div>
                                    <label class="block text-xs text-gray-300 mb-1">결과 개수 (count)</label>
                                    <input type="number" min="1" max="64" value="${d.resultCount || 1}"
                                        oninput="updateActiveFileField('resultCount', this.value)"
                                        class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-1.5 text-xs font-mono text-white">
                                </div>
                                ${!isShapedOrShapeless ? `
                                <div>
                                    <label class="block text-xs text-gray-300 mb-1">제련 시간 (틱, 200=10초)</label>
                                    <input type="number" min="1" value="${d.cookingTime || 200}"
                                        oninput="updateActiveFileField('cookingTime', this.value)"
                                        class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-1.5 text-xs font-mono text-white">
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // 기타 모든 JSON 카테고리 범용 동적 폼 빌더
            const fieldEntries = Object.entries(d);
            container.innerHTML = `
                <div class="bg-mc-bg border border-mc-border rounded-xl p-4 space-y-3">
                    <p class="text-[11px] text-gray-400">속성 값을 수정하면 우측 ${v.id} 호환 JSON 코드가 즉시 업데이트됩니다.</p>
                    ${fieldEntries.map(([k, val]) => {
                        if (typeof val === 'boolean') {
                            return `
                                <label class="flex items-center gap-2 text-xs text-gray-200 cursor-pointer py-1">
                                    <input type="checkbox" ${val ? 'checked' : ''} onchange="updateActiveFileField('${k}', this.checked)">
                                    <span class="font-mono">${escapeHtml(k)}</span>
                                </label>
                            `;
                        }
                        if (typeof val === 'number') {
                            return `
                                <div>
                                    <label class="block text-xs font-mono text-gray-300 mb-1">${escapeHtml(k)}</label>
                                    <input type="number" step="any" value="${val}"
                                        oninput="updateActiveFileField('${k}', Number(this.value))"
                                        class="w-full bg-mc-card border border-mc-border rounded-lg px-3 py-1.5 text-xs font-mono text-white">
                                </div>
                            `;
                        }
                        const isItemField = k.toLowerCase().includes('item');
                        return `
                            <div>
                                <label class="block text-xs font-mono text-gray-300 mb-1">${escapeHtml(k)}</label>
                                <div class="flex gap-2">
                                    <input type="text" value="${escapeHtml(val)}"
                                        oninput="updateActiveFileField('${k}', this.value)"
                                        class="flex-1 bg-mc-card border border-mc-border rounded-lg px-3 py-1.5 text-xs font-mono text-emerald-300">
                                    ${isItemField ? `<button type="button" onclick="openItemPicker('field:${k}', 0)" class="px-2.5 py-1.5 rounded-lg bg-mc-card border border-mc-border hover:border-emerald-500 text-xs">🎒</button>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function appendFunctionCmd(cmd) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file || file.categoryId !== 'function') return;
            file.data.commands = (file.data.commands ? file.data.commands + '\n' : '') + cmd;
            file.rawText = file.data.commands;
            renderVisualBuilder();
            renderCodeEditor();
        }

        function updateTagValue(idx, val) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file || !Array.isArray(file.data.values)) return;
            file.data.values[idx] = val;
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderCodeEditor();
        }

        function removeTagValue(idx) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file || !Array.isArray(file.data.values)) return;
            file.data.values.splice(idx, 1);
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderVisualBuilder();
            renderCodeEditor();
        }

        function addTagValue() {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file) return;
            if (!Array.isArray(file.data.values)) file.data.values = [];
            file.data.values.push(`${state.defaultNamespace}:new_entry`);
            file.rawText = serializeFileToText(file, getCurrentVersion());
            renderVisualBuilder();
            renderCodeEditor();
        }

        /**
         * ============================================================================
         * 6. 새 파일 생성 모달 & 버전별 비주얼 아이템 선택기(Item Picker)
         * ============================================================================
         */
        let pendingCategoryId = null;

        function openCreateFileModal(categoryId) {
            const cat = FEATURE_CATEGORIES.find(c => c.id === categoryId);
            if (!cat) return;
            pendingCategoryId = categoryId;

            document.getElementById('modalCategoryTitle').textContent = `${cat.icon} ${cat.name} 추가`;
            document.getElementById('modalCategoryDesc').textContent = cat.desc;

            const nsInput = document.getElementById('modalNamespaceInput');
            const nameInput = document.getElementById('modalFileNameInput');
            const subWrapper = document.getElementById('modalSubfolderWrapper');
            const tagSelect = document.getElementById('modalTagTypeSelect');

            if (cat.isSystemTag) {
                nsInput.value = 'minecraft';
                nsInput.disabled = true;
                nameInput.value = cat.fixedName;
                nameInput.disabled = true;
            } else {
                nsInput.value = state.defaultNamespace;
                nsInput.disabled = false;
                nameInput.value = `custom_${cat.id}`;
                nameInput.disabled = false;
            }

            if (cat.id === 'tags') {
                subWrapper.classList.remove('hidden');
                tagSelect.innerHTML = `
                    <option value="block">블록 태그 (blocks / block)</option>
                    <option value="item">아이템 태그 (items / item)</option>
                    <option value="entity_type">엔티티 태그 (entity_types / entity_type)</option>
                    <option value="function">함수 태그 (functions / function)</option>
                `;
            } else {
                subWrapper.classList.add('hidden');
            }

            updateModalPreviewPath();
            const modal = document.getElementById('newFileModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCreateFileModal() {
            const modal = document.getElementById('newFileModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingCategoryId = null;
        }

        function updateModalPreviewPath() {
            if (!pendingCategoryId) return;
            const v = getCurrentVersion();
            const cat = FEATURE_CATEGORIES.find(c => c.id === pendingCategoryId);
            const ns = document.getElementById('modalNamespaceInput').value.trim() || 'custom_pack';
            const name = document.getElementById('modalFileNameInput').value.trim() || 'example';
            const subTag = document.getElementById('modalTagTypeSelect').value;

            const mockFile = {
                id: 'preview',
                categoryId: cat.isSystemTag ? 'load_tick' : pendingCategoryId,
                namespace: ns,
                name: name,
                subTagType: subTag
            };
            document.getElementById('modalPreviewPath').textContent = `생성 경로: ${resolveFilePath(mockFile, v)}`;
        }

        function confirmCreateFile() {
            if (!pendingCategoryId) return;
            const v = getCurrentVersion();
            const cat = FEATURE_CATEGORIES.find(c => c.id === pendingCategoryId);
            const ns = document.getElementById('modalNamespaceInput').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'custom_pack';
            const name = document.getElementById('modalFileNameInput').value.trim().toLowerCase().replace(/[^a-z0-9_/-]/g, '') || 'custom_item';
            const subTag = document.getElementById('modalTagTypeSelect').value;

            const actualCatId = cat.isSystemTag ? 'load_tick' : pendingCategoryId;
            const newId = `${actualCatId}_${ns}_${name}_${Date.now()}`;
            const data = createDefaultFileData(pendingCategoryId, ns, name, v, subTag);
            const newFile = {
                id: newId,
                categoryId: actualCatId,
                namespace: ns,
                name: name,
                subTagType: subTag,
                data
            };
            newFile.rawText = serializeFileToText(newFile, v);

            state.files.push(newFile);
            state.activeFileId = newId;
            closeCreateFileModal();
            switchSidebarTab('files');
            refreshAllUI();
            showToast(`${resolveFilePath(newFile, v)} 파일이 생성되었습니다.`);
        }

        let itemPickerTarget = { mode: 'grid', index: 0 };

        function openItemPicker(mode, index = 0) {
            itemPickerTarget = { mode, index };
            const v = getCurrentVersion();
            document.getElementById('itemPickerVersionBadge').textContent = `MC ${v.id} 호환`;
            document.getElementById('itemSearchInput').value = '';
            document.getElementById('itemCustomDirectInput').value = '';
            renderItemPickerGrid();

            const modal = document.getElementById('itemPickerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeItemPicker() {
            const modal = document.getElementById('itemPickerModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderItemPickerGrid() {
            const v = getCurrentVersion();
            const query = (document.getElementById('itemSearchInput').value || '').trim().toLowerCase();
            const catFilter = document.getElementById('itemPickerCatFilter').value;
            const gridEl = document.getElementById('itemPickerGrid');

            const filtered = MC_ITEMS_DB.filter(item => {
                if (v.major < item.minFormat) return false;
                if (catFilter !== 'all' && item.cat !== catFilter) return false;
                if (query && !item.name.toLowerCase().includes(query) && !item.id.toLowerCase().includes(query)) return false;
                return true;
            });

            if (!filtered.length) {
                gridEl.innerHTML = `<div class="col-span-full text-center text-xs text-gray-400 py-10">검색 결과가 없습니다. 하단 입력창에서 아이템 ID를 직접 입력할 수 있습니다.</div>`;
                return;
            }

            gridEl.innerHTML = filtered.map(item => `
                <button type="button" onclick="selectPickedItem('${item.id}')"
                    class="flex flex-col items-center gap-1.5 p-2.5 rounded-xl bg-mc-bg hover:bg-mc-card border border-mc-border hover:border-emerald-500 transition text-center cursor-pointer">
                    ${renderItemIconHtml(item.id, 'w-8 h-8')}
                    <span class="text-[11px] font-semibold text-gray-200 truncate w-full">${escapeHtml(item.name)}</span>
                    <span class="text-[9px] font-mono text-gray-500 truncate w-full">${item.id.replace('minecraft:', '')}</span>
                </button>
            `).join('');
        }

        function selectPickedItem(itemId) {
            const file = state.files.find(f => f.id === state.activeFileId);
            if (!file) return;

            if (itemPickerTarget.mode === 'grid') {
                if (!Array.isArray(file.data.gridItems)) file.data.gridItems = Array(9).fill('');
                file.data.gridItems[itemPickerTarget.index] = itemId;
            } else if (itemPickerTarget.mode === 'result') {
                file.data.resultItem = itemId || 'minecraft:stone';
            } else if (itemPickerTarget.mode === 'ingredient') {
                file.data.ingredient = itemId || 'minecraft:raw_iron';
            } else if (itemPickerTarget.mode.startsWith('field:')) {
                const fieldKey = itemPickerTarget.mode.slice(6);
                file.data[fieldKey] = itemId;
            }

            file.rawText = serializeFileToText(file, getCurrentVersion());
            closeItemPicker();
            renderVisualBuilder();
            renderCodeEditor();
        }

        // 페이지 로드 시 전체 초기화 실행
        window.addEventListener('DOMContentLoaded', () => {
            renderVersionDropdown();
            initDefaultProject();
            bindEvents();
            refreshAllUI();
        });

        function bindEvents() {
            // 현재 파일 삭제 버튼
            document.getElementById('btnDeleteCurrentFile').addEventListener('click', () => {
                deleteFile(state.activeFileId);
            });

            // 모달 이벤트
            document.getElementById('btnCloseModal').addEventListener('click', closeCreateFileModal);
            document.getElementById('btnCancelModal').addEventListener('click', closeCreateFileModal);
            document.getElementById('btnConfirmCreateFile').addEventListener('click', confirmCreateFile);
            document.getElementById('modalNamespaceInput').addEventListener('input', updateModalPreviewPath);
            document.getElementById('modalFileNameInput').addEventListener('input', updateModalPreviewPath);
            document.getElementById('modalTagTypeSelect').addEventListener('change', updateModalPreviewPath);

            // 버전 변경 이벤트
            document.getElementById('versionSelect').addEventListener('change', (e) => {
                state.selectedVersionId = e.target.value;
                const v = getCurrentVersion();
                state.files.forEach(f => {
                    f.rawText = serializeFileToText(f, v);
                });
                refreshAllUI();
                showToast(`타겟 버전이 MC ${v.id} (포맷 ${v.format})(으)로 변경되었습니다.`);
            });

            // 카테고리 그룹 필터 버튼
            document.querySelectorAll('.cat-group-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-group-btn').forEach(b => {
                        b.className = 'cat-group-btn flex-1 py-1.5 rounded-lg font-semibold text-gray-400 hover:text-white';
                    });
                    btn.className = 'cat-group-btn flex-1 py-1.5 rounded-lg font-semibold bg-mc-card text-white shadow';
                    state.activeGroupFilter = btn.dataset.group;
                    renderCategoryList();
                });
            });

            // 우측 코드 에디터 직접 입력 반영
            document.getElementById('rawCodeEditor').addEventListener('input', (e) => {
                const file = state.files.find(f => f.id === state.activeFileId);
                if (!file) return;
                file.rawText = e.target.value;
                if (file.categoryId === 'function') {
                    file.data.commands = e.target.value;
                }
                const status = document.getElementById('jsonValidStatus');
                if (file.categoryId !== 'function') {
                    try {
                        JSON.parse(file.rawText);
                        status.textContent = '✓ 유효한 JSON 구조입니다';
                        status.className = 'text-emerald-400 font-medium';
                    } catch (err) {
                        status.textContent = '⚠️ JSON 문법 오류가 있습니다';
                        status.className = 'text-amber-400 font-medium';
                    }
                } else {
                    status.textContent = `✓ 총 ${file.rawText.split('\n').length}줄 명령어 스크립트`;
                }
            });

            // JSON 정렬 버튼
            document.getElementById('btnFormatJson').addEventListener('click', () => {
                const file = state.files.find(f => f.id === state.activeFileId);
                if (!file || file.categoryId === 'function') return;
                try {
                    const parsed = JSON.parse(file.rawText);
                    file.rawText = JSON.stringify(parsed, null, 2);
                    renderCodeEditor();
                    showToast('JSON 코드가 깔끔하게 정렬되었습니다.');
                } catch (e) {
                    showToast('JSON 문법 오류가 있어 정렬할 수 없습니다.', 'error');
                }
            });

            // 코드 복사 버튼
            document.getElementById('btnCopyCode').addEventListener('click', () => {
                const editor = document.getElementById('rawCodeEditor');
                editor.select();
                document.execCommand('copy');
                showToast('코드가 클립보드에 복사되었습니다!');
            });

            // 팩 설정 버튼
            document.getElementById('btnPackSettings').addEventListener('click', () => {
                selectFile('pack.mcmeta');
                switchSidebarTab('files');
            });

            // .ZIP 데이터팩 내보내기 버튼
            document.getElementById('btnExportZip').addEventListener('click', async () => {
                try {
                    if (typeof JSZip === 'undefined') {
                        showToast('JSZip 라이브러리를 불러오지 못했습니다.', 'error');
                        return;
                    }
                    const zip = new JSZip();
                    const v = getCurrentVersion();

                    state.files.forEach(file => {
                        const filePath = resolveFilePath(file, v);
                        zip.file(filePath, file.rawText || '');
                    });

                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${state.defaultNamespace}_mc_${v.id}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast(`데이터팩 .ZIP 파일이 다운로드되었습니다!`);
                } catch (err) {
                    showToast('ZIP 생성 중 오류가 발생했습니다: ' + err.message, 'error');
                }
            });
        }
    </script>
</body>
</html>
